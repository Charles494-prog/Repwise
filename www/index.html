<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#ffffff">
<title>GymQuest</title>
<style>
:root{--bg:#f5f5f8;--card:#fff;--txt:#1c1c28;--muted:#8d8da0;--line:#eeeef3;--acc:#ff4f6d;--acc2:#ff8a5c;--good:#22c55e;--warn:#f59e0b;--r:18px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;font-family:"Nunito","Poppins",system-ui,sans-serif}
html,body{background:var(--bg);color:var(--txt);overscroll-behavior:none}
body{padding:env(safe-area-inset-top) 0 calc(76px + env(safe-area-inset-bottom))}
body.full{padding-bottom:env(safe-area-inset-bottom)}
body.full nav{display:none}
#app{padding:0 16px;min-height:100vh}
.anim-fade{animation:fade .35s ease}
.anim-push{animation:push .35s cubic-bezier(.2,.8,.2,1)}
.anim-pop{animation:popback .35s cubic-bezier(.2,.8,.2,1)}
.anim-up{animation:up .45s cubic-bezier(.2,.8,.2,1)}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes push{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}
@keyframes popback{from{opacity:0;transform:translateX(-40px)}to{opacity:1;transform:none}}
@keyframes up{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:none}}
@keyframes bounce{0%{transform:scale(.6)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
@keyframes floatUp{0%{opacity:0;transform:translate(-50%,0) scale(.6)}20%{opacity:1;transform:translate(-50%,-20px) scale(1.1)}100%{opacity:0;transform:translate(-50%,-110px) scale(1)}}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.stagger>*{animation:fade .45s ease both}
.stagger>*:nth-child(2){animation-delay:.05s}.stagger>*:nth-child(3){animation-delay:.1s}.stagger>*:nth-child(4){animation-delay:.15s}.stagger>*:nth-child(5){animation-delay:.2s}.stagger>*:nth-child(6){animation-delay:.25s}.stagger>*:nth-child(7){animation-delay:.3s}.stagger>*:nth-child(8){animation-delay:.35s}.stagger>*:nth-child(n+9){animation-delay:.4s}
.top{display:flex;align-items:center;justify-content:space-between;padding:18px 0 12px}
.top h1{font-size:26px;font-weight:800}
.chip{display:inline-flex;align-items:center;gap:4px;background:#fff;border-radius:20px;padding:6px 12px;font-weight:800;font-size:14px;box-shadow:0 2px 10px #0000000d}
.iconbtn{width:40px;height:40px;border-radius:50%;border:none;background:#fff;box-shadow:0 2px 10px #0000000f;font-size:18px;display:grid;place-items:center;cursor:pointer}
.datenav{display:flex;align-items:center;justify-content:space-between;margin:4px 0 14px}
.datenav b{display:block;text-align:center;font-size:17px}.datenav small{display:block;text-align:center;color:var(--muted);font-size:13px}
.list{background:var(--card);border-radius:var(--r);overflow:hidden;box-shadow:0 4px 20px #0000000a}
.row{display:flex;align-items:center;gap:12px;padding:14px;border-bottom:1px solid var(--line);cursor:pointer;transition:background .15s,transform .15s}
.row:last-child{border-bottom:none}
.row:active{background:#fafafa;transform:scale(.985)}
.check{width:24px;height:24px;border-radius:50%;border:2px solid #d4d4de;flex:none;display:grid;place-items:center;transition:.25s}
.check.on{background:var(--good);border-color:var(--good);animation:bounce .4s}
.check.on::after{content:"✓";color:#fff;font-weight:900;font-size:14px}
.tile{width:58px;height:58px;border-radius:14px;flex:none;display:grid;place-items:center;font-size:30px}
.rbody{flex:1;min-width:0}.rbody b{font-size:16px;display:block}.rbody small{color:var(--muted);font-size:13px;display:block;margin-top:2px}
.chev{color:#c4c4d0;font-size:22px}
.prog{height:5px;background:#eeeef3;border-radius:3px;margin-top:8px;overflow:hidden}
.prog>i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,var(--acc),var(--acc2));transition:width .8s cubic-bezier(.2,.8,.2,1)}
.card{background:var(--card);border-radius:var(--r);padding:16px;margin-bottom:14px;box-shadow:0 4px 20px #0000000a}
.card h3{font-size:17px;margin-bottom:10px}
.sec{font-size:18px;font-weight:800;margin:20px 0 10px}
.muted{color:var(--muted);font-size:14px}
.btn{display:block;width:100%;padding:16px;border:none;border-radius:16px;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;font-size:17px;font-weight:800;cursor:pointer;box-shadow:0 8px 20px #ff4f6d40;transition:transform .12s}
.btn:active{transform:scale(.97)}
.btn.sec2{background:#fff;color:var(--txt);box-shadow:0 2px 10px #0000000f}
.btn.sm{display:inline-block;width:auto;padding:8px 14px;font-size:14px;border-radius:12px}
.sticky{position:sticky;bottom:calc(84px + env(safe-area-inset-bottom));margin-top:16px}
body.full .sticky{bottom:16px}
input,select{width:100%;padding:14px;border-radius:14px;border:1.5px solid var(--line);background:#fff;font-size:16px;margin:5px 0;color:var(--txt);outline:none}
input:focus,select:focus{border-color:var(--acc)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.flex{display:flex;gap:10px;align-items:center}.flex>*{flex:1}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#fff;border-top:1px solid var(--line);padding:6px 0 calc(6px + env(safe-area-inset-bottom));z-index:5}
nav button{flex:1;background:none;border:none;color:#9b9bab;font-size:11px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
nav button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .2s}
nav button.on{color:var(--acc)}nav button.on svg{transform:translateY(-2px) scale(1.1)}
.feat{transform:scale(1.03);box-shadow:0 12px 30px #0000001a;border-radius:var(--r);background:#fff;position:relative;z-index:1;margin:6px 0 12px}
#toast{position:fixed;top:calc(16px + env(safe-area-inset-top));left:16px;right:16px;background:#1c1c28;color:#fff;padding:14px 18px;border-radius:16px;font-weight:700;z-index:30;transform:translateY(-150%);transition:transform .35s cubic-bezier(.2,.8,.2,1);text-align:center;font-size:15px}
#toast.show{transform:none}
.xpfly{position:fixed;left:50%;top:45%;font-size:34px;font-weight:900;color:var(--acc);z-index:40;pointer-events:none;animation:floatUp 1.3s ease-out forwards;text-shadow:0 4px 14px #ff4f6d55}
.confetti{position:fixed;top:-20px;width:10px;height:14px;z-index:50;pointer-events:none;animation:fall linear forwards;border-radius:2px}
#sheetbg{position:fixed;inset:0;background:#0006;z-index:20;opacity:0;pointer-events:none;transition:opacity .3s}
#sheetbg.show{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:0;right:0;bottom:0;background:#fff;border-radius:24px 24px 0 0;padding:10px 18px calc(24px + env(safe-area-inset-bottom));z-index:21;transform:translateY(105%);transition:transform .38s cubic-bezier(.2,.8,.2,1);max-height:88vh;overflow:auto}
#sheet.show{transform:none}
#sheet .grab{width:40px;height:5px;background:#ddd;border-radius:3px;margin:0 auto 14px}
/* onboarding */
.ob{min-height:100vh;display:flex;flex-direction:column;padding:16px 0 24px}
.obbar{height:6px;background:#eceef3;border-radius:3px;overflow:hidden;margin:10px 0 26px}
.obbar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));transition:width .5s}
.ob h2{font-size:27px;font-weight:800;margin-bottom:6px;line-height:1.2}
.opt{display:flex;align-items:center;gap:14px;background:#fff;border:2px solid transparent;border-radius:18px;padding:16px;margin:10px 0;cursor:pointer;box-shadow:0 2px 12px #0000000a;transition:.2s}
.opt:active{transform:scale(.98)}.opt.on{border-color:var(--acc);background:#fff5f7}
.opt .e{font-size:32px}.opt b{font-size:17px;display:block}.opt small{color:var(--muted)}
.bignum{display:flex;align-items:center;justify-content:center;gap:18px;margin:40px 0}
.bignum input{width:150px;text-align:center;font-size:54px;font-weight:900;border:none;background:none;padding:0}
.bignum button{width:56px;height:56px;border-radius:50%;border:none;background:#fff;font-size:28px;font-weight:800;box-shadow:0 4px 14px #00000014;cursor:pointer}
.unit{text-align:center;color:var(--muted);font-weight:700;margin-top:-30px}
.loader{width:120px;height:120px;border-radius:50%;border:10px solid #eee;border-top-color:var(--acc);animation:spin 1s linear infinite;margin:60px auto 30px}
.big{font-size:34px;font-weight:900}
.stat{background:#fff;border-radius:16px;padding:14px;box-shadow:0 2px 12px #0000000a}
.stat small{color:var(--muted);font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.4px}
.stat b{display:block;font-size:24px;font-weight:900;margin-top:2px}
/* quest path */
.node{display:flex;gap:12px;position:relative;padding-bottom:16px}
.node:not(:last-child)::before{content:"";position:absolute;left:19px;top:40px;bottom:0;width:3px;background:#eceef3}
.node.done:not(:last-child)::before{background:var(--good)}
.dot{width:40px;height:40px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:18px;background:#eceef3;z-index:1}
.node.done .dot{background:var(--good);color:#fff}
.node.cur .dot{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;animation:pulse 1.6s infinite}
.badge{display:inline-block;padding:3px 10px;border-radius:10px;font-size:12px;font-weight:800}
.segs{display:flex;gap:4px;margin:12px 0}.segs i{flex:1;height:5px;border-radius:3px;background:#e5e5ec}.segs i.on{background:var(--acc)}
.player-ex{text-align:center;padding:10px 0}
.player-ex .tile{width:110px;height:110px;font-size:60px;margin:10px auto;border-radius:28px;animation:bounce .5s}
.stepper{display:flex;align-items:center;background:#fff;border-radius:16px;padding:6px;box-shadow:0 2px 12px #0000000a}
.stepper button{width:44px;height:44px;border-radius:12px;border:none;background:#f3f3f7;font-size:22px;font-weight:800;cursor:pointer}
.stepper input{border:none;text-align:center;font-size:24px;font-weight:900;padding:4px;margin:0}
.stepper label{display:block}
.lbl{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;text-align:center;margin-bottom:4px}
.setrow{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);font-weight:700;animation:fade .3s}
.tip{background:#fff5f0;border-radius:14px;padding:12px 14px;margin:8px 0;font-size:14px;line-height:1.4}
.map{background:#eef2f7;border-radius:var(--r);height:240px;overflow:hidden;position:relative}
.runstats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;text-align:center;margin:14px 0}
.runstats b{display:block;font-size:26px;font-weight:900}.runstats small{color:var(--muted);font-weight:700;font-size:12px}
</style>
</head>
<body>
<main id="app"></main>
<div id="toast"></div>
<div id="sheetbg" onclick="closeSheet()"></div><div id="sheet"></div>
<nav id="nav"></nav>
<script>
const V={};
// ================= DATA =================

const EX={

 'Pull-up':[['Back'],['Biceps'],'🧗'],'Lat Pulldown':[['Back'],['Biceps'],'⬇️'],'Barbell Row':[['Back'],['Biceps'],'🚣'],'Seated Cable Row':[['Back'],['Biceps'],'🚣'],'Deadlift':[['Back','Hamstrings','Glutes'],['Core'],'🏋️'],

 'Barbell Curl':[['Biceps'],[],'💪'],'Hammer Curl':[['Biceps'],[],'🔨'],'Tricep Pushdown':[['Triceps'],[],'⬇️'],'Skull Crusher':[['Triceps'],[],'💀'],'Dips':[['Triceps','Chest'],[],'⬇️'],

 'Romanian Deadlift':[['Hamstrings','Glutes'],['Back'],'🏋️'],'Leg Curl':[['Hamstrings'],[],'🦵'],'Hip Thrust':[['Glutes'],['Hamstrings'],'🍑'],'Calf Raise':[['Calves'],[],'🦶'],

 'Straight Bar Dip':[['Triceps','Chest'],['Shoulders'],'⬇️'],'Muscle-up':[['Back','Triceps'],['Chest','Core','Biceps'],'🦅'],

 pull:{name:'Pull Day',sub:'Back & Biceps',e:'🧗',bg:'#e0f2fe',ex:['Pull-up','Barbell Row','Lat Pulldown','Face Pull','Barbell Curl','Hammer Curl'],m:['Back','Biceps']},

 full:{name:'Full Body',sub:'Big compound lifts',e:'⚡',bg:'#fef3c7',ex:['Squat','Bench Press','Barbell Row','Overhead Press','Romanian Deadlift'],m:MUSCLES},
 home:{name:'Fitness at Home',sub:'No equipment needed',e:'🏠',bg:'#ede9fe',ex:['Push-up','Lunge','Australian Row','Plank Hold (sec)','Crunch','Knee Push-up'],m:['Chest','Quads','Core']},
 free:{name:'Free Workout',sub:'Pick any exercise',e:'🎲',bg:'#fce7f3',ex:[],m:[]},
};
const RANKS=[['Iron','#9ca3af'],['Bronze','#cd7f32'],['Silver','#a8b0bd'],['Gold','#eab308'],['Platinum','#14b8a6'],['Diamond','#3b82f6'],['Master','#a855f7'],['Grandmaster','#ef4444'],['Legend','#f97316']];
const DIVS=['III','II','I'];
const tierXP=i=>Math.round(300*Math.pow(1.35,i));
const FOODS={'Rice (1 cup cooked)':[205,4],'Chicken breast (100g)':[165,31],'Egg (1 large)':[72,6],'Banana':[105,1],'Oats (1/2 cup dry)':[150,5],'Whey scoop':[120,24],'Bread slice':[80,3],'Peanut butter (1 tbsp)':[95,4],'Tuna can':[120,26],'Milk (1 cup)':[150,8],'Apple':[95,0],'Pork adobo (1 cup)':[450,30],'Beef (100g)':[250,26],'Greek yogurt (170g)':[100,17],'Sweet potato (medium)':[110,2]};
const TREES={
 pushup:{name:'20 Push-ups',icon:'💥',steps:[
  ['Plank Hold (sec)',30,'Build a solid core: 3× max plank holds, 3×/week.'],['Incline Push-up',10,'Hands on a bench/table. 3×8–12, lower the incline as it gets easy.'],
  ['Knee Push-up',12,'3 sets to near failure, slow 3-sec lowering.'],['Push-up',3,'Sets of 1–2 perfect reps all day (greasing the groove) + knee push-ups.'],
  ['Push-up',8,'5 sets of 60% of your max, every other day.'],['Push-up',12,'Pyramid: 1-2-3-4-5-4-3-2-1 reps with 30s rest.'],
  ['Push-up',16,'3× max sets + 2 sets of slow tempo push-ups.'],['Push-up',20,'Final boss: 20 strict reps, chest to fist, no sagging hips! 🏆']]},
 muscleup:{name:'Pull-up → Muscle-up',icon:'🦅',steps:[
  ['Dead Hang (sec)',30,'Hang from the bar: 3× max holds. Builds grip.'],['Scapular Pull-up',10,'Hang, pull shoulder blades down without bending arms. 3×8–10.'],
  ['Australian Row',12,'Bar at hip height, body straight, chest to bar. 3×max.'],['Negative Pull-up',5,'Jump to the top, lower over 5 seconds. 3×3–5.'],

  ['Muscle-up',1,'Explosive pull + lean over the bar + dip. Practice with a band. 🏆'],['Muscle-up',5,'Legend tier: 5 clean muscle-ups! 👑']]},

const SCIENCE=[
 ['🥩','Protein','Eating about 1.6–2.2 g of protein per kg of bodyweight a day maximizes muscle gain from training.','Morton et al., 2018 meta-analysis, Br J Sports Med'],
 ['📅','Frequency','Training each muscle at least 2× per week builds more muscle than once a week, at the same total volume.','Schoenfeld et al., 2016 meta-analysis, Sports Med'],
 ['📈','Volume','More weekly sets per muscle means more growth — aim for about 10+ hard sets per muscle per week.','Schoenfeld et al., 2017 dose-response meta-analysis, J Sports Sci'],
 ['🔥','Effort','Sets only build muscle if they are hard. Finish most sets with about 0–3 reps left in the tank.','Refalo et al., 2023 meta-analysis, Sports Med'],
 ['⏱️','Rest','Resting 2–3 minutes between sets of big lifts gives more strength and size than resting 1 minute.','Schoenfeld et al., 2016, J Strength Cond Res'],
 ['😴','Sleep','Dieters who slept 5.5 h instead of 8.5 h lost 55% less fat and 60% more muscle. Sleep is part of your plan.','Nedeltcheva et al., 2010, Ann Intern Med'],
 ['🐢','Rate of loss','Losing about 0.5–1% of bodyweight per week helps you keep muscle while cutting.','Helms et al., 2014, J Int Soc Sports Nutr'],
 ['👟','Steps','Around 7,000–9,000 steps a day is linked with a much lower risk of early death compared with ~4,000.','Paluch et al., 2022 meta-analysis, Lancet Public Health'],
 ['💊','Creatine','Creatine monohydrate (3–5 g/day) is one of the most researched supplements: safe and boosts strength & muscle.','ISSN position stand, Kreider et al., 2017'],
 ['☕','Caffeine','3–6 mg of caffeine per kg about 60 min before training reliably improves performance.','ISSN position stand, Guest et al., 2021'],
 ['⚖️','Weigh-ins','Daily weight swings 1–2 kg from water and food. Judge progress by your weekly average, not one day.','Water/glycogen fluctuation, general consensus'],
 ['🏋️','Lift on a cut','Lifting while dieting preserves muscle, so more of the weight you lose comes from fat.','Murphy & Koehler, 2022 meta-analysis, Scand J Med Sci Sports'],
 ['📏','Range of motion','Full range of motion — especially the stretched part of the lift — tends to build more muscle than half reps.','Pallarés et al., 2021 systematic review'],
 ['🍽️','Protein timing','Spreading protein over 3–5 meals (~0.4 g/kg each) is a simple way to maximize muscle building across the day.','Schoenfeld & Aragon, 2018, J Int Soc Sports Nutr'],
 ['🧠','Consistency','Habits take on average ~2 months to become automatic — missing one day does not break the habit.','Lally et al., 2010, Eur J Soc Psychol'],

const CHEERS=['Small steps every day beat perfect plans you never start.','You don\'t have to be extreme, just consistent.','The best workout is the one you actually do.','Your future self is already thanking you.','Strong is built one rep at a time.','Progress, not perfection.','Show up today. That\'s the whole secret.','Every set is a vote for who you\'re becoming.'];
const dayIdx=()=>Math.floor(Date.now()/864e5);
const PASTEL=['#ffe4e6','#e0f2fe','#dcfce7','#fef3c7','#ede9fe','#fce7f3','#e0e7ff','#ccfbf1'];

// ================= STATE =================
let S=JSON.parse(localStorage.getItem('gq')||'null')||{};
S.profile??=null;S.food??={};S.workouts??=[];S.xp??={};S.active??=null;S.quests??={};S.custom??=[];S.water??={};S.steps??={};S.weights??=[];S.runs??=[];
MUSCLES.forEach(m=>S.xp[m]??=0);S.customEx??={};Object.assign(EX,S.customEx);
const save=()=>localStorage.setItem('gq',JSON.stringify(S));
const iso=d=>{const x=new Date(d);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')};
const today=()=>iso(Date.now());
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let viewDate=today();

// ================= FX =================
function toast(t){const e=$('#toast');e.innerHTML=t;e.classList.add('show');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('show'),2800)}
function xpFly(t){const d=document.createElement('div');d.className='xpfly';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),1400);vib(30)}
function confetti(n=60){const c=['#ff4f6d','#ff8a5c','#22c55e','#3b82f6','#eab308','#a855f7'];for(let i=0;i<n;i++){const d=document.createElement('div');d.className='confetti';d.style.left=Math.random()*100+'vw';d.style.background=c[i%c.length];d.style.animationDuration=1.5+Math.random()*1.5+'s';d.style.animationDelay=Math.random()*.4+'s';document.body.appendChild(d);setTimeout(()=>d.remove(),3500)}vib([40,40,80])}
function vib(p){try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}}
function openSheet(h){$('#sheet').innerHTML='<div class="grab"></div>'+h;$('#sheet').classList.add('show');$('#sheetbg').classList.add('show')}
function closeSheet(){$('#sheet').classList.remove('show');$('#sheetbg').classList.remove('show')}
function countUp(){document.querySelectorAll('[data-count]').forEach(el=>{const to=+el.dataset.count,st=performance.now(),dec=+(el.dataset.dec||0);
 const f=t=>{const p=Math.min(1,(t-st)/900),e=1-Math.pow(1-p,3);el.textContent=(to*e).toFixed(dec).replace(/\B(?=(\d{3})+(?!\d))/g,',');if(p<1)requestAnimationFrame(f)};requestAnimationFrame(f)})}

// ================= CALCS =================
function rankOf(xp){let i=0;while(xp>=tierXP(i)&&i<RANKS.length*3-1){xp-=tierXP(i);i++}const [n,c]=RANKS[Math.floor(i/3)];return{name:n+' '+DIVS[i%3],color:c,idx:i,cur:xp,need:tierXP(i)}}
function bodyFat(){const p=S.profile;if(!p)return null;const bmi=p.weight/Math.pow(p.height/100,2);
 if(p.waist&&p.neck&&(p.sex==='m'||p.hip)){const l=Math.log10;const bf=p.sex==='m'?495/(1.0324-0.19077*l(p.waist-p.neck)+0.15456*l(p.height))-450:495/(1.29579-0.35004*l(p.waist+p.hip-p.neck)+0.221*l(p.height))-450;return{bf,bmi,method:'US Navy tape method (±3%)'}}
 const base=1.2*bmi+0.23*p.age-10.8*(p.sex==='m'?1:0)-5.4,adj={lean:-4,athletic:-2,average:0,soft:3,heavy:6}[p.build||'average'];
 return{bf:Math.max(4,base+adj),bmi,method:'Estimated from BMI, age & build (±5%). Add waist & neck for better accuracy.'}}
function bfLabel(bf,sex){const c=sex==='m'?[6,14,18,25]:[14,21,25,32];return bf<c[0]?'Stage-lean':bf<c[1]?'Athletic 💪':bf<c[2]?'Fit':bf<c[3]?'Average':'Above average'}
function targets(){const p=S.profile;if(!p)return null;const bmr=10*p.weight+6.25*p.height-5*p.age+(p.sex==='m'?5:-161),tdee=bmr*p.activity,adj={cut:-500,slowcut:-250,maintain:0,bulk:300}[p.goal];
 return{bmr:Math.round(bmr),tdee:Math.round(tdee),kcal:Math.round(tdee+adj),protein:Math.round(p.weight*(p.goal==='bulk'?1.8:2.0)),adj,water:Math.round(p.weight*35/250)*250,steps:p.goal.includes('cut')?10000:8000}}
const dayFood=d=>S.food[d]||[];
const sum=(a,i)=>a.reduce((s,x)=>s+x[i],0);
const e1rm=(w,r)=>w*(1+r/30);
function bestSet(ex){let b=null;for(const w of S.workouts)for(const s of w.sets)if(s.ex===ex&&(!b||e1rm(s.w,s.r)>e1rm(b.w,b.r)))b=s;return b}
function lastSets(ex){for(let i=S.workouts.length-1;i>=0;i--){const ss=S.workouts[i].sets.filter(s=>s.ex===ex);if(ss.length)return ss}return null}
function sugg(ex){const ls=lastSets(ex);if(!ls)return{w:0,r:10,text:'First time! Pick a weight you can do for 8–12 clean reps.'};
 const t=ls.reduce((a,b)=>e1rm(b.w,b.r)>e1rm(a.w,a.r)?b:a);
 if(t.r>=12&&t.w>0)return{w:+(t.w+2.5).toFixed(1),r:8,text:`Last time ${t.w}kg × ${t.r}. 🔥 Go heavier: <b>${+(t.w+2.5).toFixed(1)}kg × 8</b>`};
 return{w:t.w,r:t.r+1,text:`Last time ${t.w}kg × ${t.r}. Beat it: <b>${t.w}kg × ${t.r+1}</b>${t.w?` or <b>${+(t.w+2.5).toFixed(1)}kg × ${Math.max(t.r-2,5)}</b>`:''}`}}
function daysSince(m){for(let i=S.workouts.length-1;i>=0;i--)if(S.workouts[i].sets.some(s=>EX[s.ex]&&EX[s.ex][0].includes(m)))return Math.floor((Date.now()-S.workouts[i].ts)/864e5);return null}
function streak(){const days=new Set([...S.workouts.map(w=>iso(w.ts)),...Object.keys(S.food).filter(k=>S.food[k].length)]);let n=0,d=new Date();if(!days.has(today()))d.setDate(d.getDate()-1);while(days.has(iso(d))){n++;d.setDate(d.getDate()-1)}return n}
function level(){const total=MUSCLES.reduce((s,m)=>s+S.xp[m],0),lvl=Math.floor(Math.sqrt(total/100))+1,a=Math.pow(lvl-1,2)*100,b=Math.pow(lvl,2)*100;return{lvl,total,cur:total-a,need:b-a}}
function setXP(set,sessionSets){const vol=set.w>0?set.w*set.r:set.r*5;let xp=Math.round(10+vol/10),pr=false;
 let prev=bestSet(set.ex);for(const s of sessionSets)if(s.ex===set.ex&&(!prev||e1rm(s.w,s.r)>e1rm(prev.w,prev.r)))prev=s;
 if(prev&&e1rm(set.w,set.r)>e1rm(prev.w,prev.r)){xp=xp*2+25;pr=true}else if(!prev)xp+=10;return{xp,pr}}
function todaysProg(){const score=k=>PROGS[k].m.reduce((s,m)=>s+(daysSince(m)??99),0)/PROGS[k].m.length;return['push','pull','legs'].reduce((a,b)=>score(b)>score(a)?b:a)}
function grantXP(ex,xp){const [pri,sec]=EX[ex],ups=[];[...pri,...sec].forEach(m=>{const b=rankOf(S.xp[m]).name;S.xp[m]+=pri.includes(m)?xp:Math.round(xp/2);const a=rankOf(S.xp[m]).name;if(a!==b)ups.push(`${m} → ${a}`)});return ups}

// ================= QUESTS =================
function questList(){const q=[];for(const id in S.quests){const t=TREES[id];q.push({id,name:t.name,icon:t.icon,steps:t.steps,i:S.quests[id]})}
 S.custom.forEach((c,k)=>q.push({id:'c'+k,name:`${c.target}× ${c.ex}`,icon:'🎯',i:c.i,steps:[.25,.5,.75,1].map(f=>[c.ex,Math.max(1,Math.round(c.start+(c.target-c.start)*f)),`Train ${c.ex} 2–3×/week. Beat your last set by +1 rep each session.`])}));return q}
function checkQuests(ex,reps){const msgs=[];for(const q of questList()){if(q.i>=q.steps.length)continue;const [e,n]=q.steps[q.i];
 if(e===ex&&reps>=n){const reward=100+q.i*50;grantXP(e,reward);if(q.id[0]==='c')S.custom[+q.id.slice(1)].i++;else S.quests[q.id]++;
  msgs.push(q.i+1>=q.steps.length?`🏆 QUEST COMPLETE: ${q.name}! +${reward} XP`:`✅ Checkpoint ${q.i+1}/${q.steps.length} cleared! +${reward} XP`)}}
 if(msgs.length)setTimeout(()=>confetti(),300);return msgs}

// ================= NAV / ROUTER =================
const ICONS={plan:'<path d="M9 4h6a1 1 0 0 1 1 1v1H8V5a1 1 0 0 1 1-1z"/><rect x="5" y="5" width="14" height="16" rx="2"/><path d="M9 11h6M9 15h4"/>',workouts:'<path d="M6 8v8M3 10v4M18 8v8M21 10v4M6 12h12"/>',run:'<circle cx="14" cy="4" r="2"/><path d="M8 21l3-6 3 2v4M6 12l3-3 4 1 2 4 3 1"/>',meals:'<path d="M7 3v8a2 2 0 0 0 2 2v8M5 3v5M9 3v5M17 3c-2 2-2 6 0 8v10"/>',challenges:'<path d="M8 4h8v5a4 4 0 0 1-8 0zM8 6H5a3 3 0 0 0 3 4M16 6h3a3 3 0 0 1-3 4M12 13v4M8 21h8"/>',more:'<path d="M4 6h16M4 12h16M4 18h16"/>'};
const TABS=[['plan','Plan'],['workouts','Workouts'],['run','Activity'],['meals','Meals'],['challenges','Challenges'],['more','More']];
let tab='plan',stack=[];
function drawNav(){$('#nav').innerHTML=TABS.map(([k,l])=>`<button class="${tab===k&&!stack.length?'on':''}" onclick="go('${k}')"><svg viewBox="0 0 24 24">${ICONS[k]}</svg>${l}</button>`).join('')}
function go(t){tab=t;stack=[];render('fade');scrollTo(0,0)}
function push(v,...a){stack.push([v,a]);render('push');scrollTo(0,0)}
function back(){stack.pop();render('pop');scrollTo(0,0)}
function render(anim){const app=$('#app');let html,full=false;
 if(!S.profile||OB.active){html=V.onboard();full=true}
 else if(stack.length){const [v,a]=stack.at(-1);html=V[v](...a);full=['player','summary','runlive'].includes(v)}
 else html=V[tab]();
 document.body.classList.toggle('full',full);app.innerHTML=html;
 if(anim){app.className='';void app.offsetWidth;app.className='anim-'+anim}
 drawNav();countUp()}
const backBtn=()=>`<button class="iconbtn" onclick="back()">‹</button>`;

const OB={active:false,step:0,d:{}};
const OBSTEPS=[
 {k:'name',q:'What should we call you?',s:'Only your name and workout data are stored — on this phone, never on a server.',txt:1},
 {k:'goal',q:"What's your main goal?",s:'We will build your plan around it.',o:[['cut','🔥','Lose fat','~0.5 kg per week'],['slowcut','🌿','Lose fat slowly','Easier to stick to'],['maintain','⚖️','Get toned','Recomp & maintain'],['bulk','💪','Build muscle','Lean bulk']]},
 {k:'sex',q:'What is your sex?',s:'Used to calculate your metabolism.',o:[['m','👨','Male'],['f','👩','Female']]},
 {k:'age',q:'How old are you?',n:[25,'years',12,90,1]},
 {k:'height',q:'How tall are you?',n:[170,'cm',120,230,1]},
 {k:'weight',q:"What's your current weight?",n:[70,'kg',30,250,.5]},
 {k:'build',q:'Which looks most like you?',s:'This helps estimate your body fat.',o:[['lean','🦴','Very lean','Visible abs & veins'],['athletic','🏃','Athletic','Some definition'],['average','🙂','Average','A little soft'],['soft','🍩','Soft','Some belly fat'],['heavy','🐻','Heavy','Carrying a lot of fat']]},
 {k:'activity',q:'How active are you?',o:[[1.2,'🛋️','Not active','Desk job, little exercise'],[1.375,'🚶','Lightly active','1–3 workouts a week'],[1.55,'🏃','Active','3–5 workouts a week'],[1.725,'⚡','Very active','6–7 workouts a week']]},
 {k:'focus',q:'Pick a skill to unlock',s:'You will get checkpoint quests for it.',o:[['pushup','💥','20 push-ups','From zero to 20 strict reps'],['muscleup','🦅','Pull-up → Muscle-up','Lift yourself over the bar'],['none','🏋️','Just get stronger','Ranks & PRs only']]},
];
function startOB(){OB.active=true;OB.step=0;OB.d={...(S.profile||{})};render('up')}
V.onboard=()=>{const st=OB.step;
 if(st===OBSTEPS.length){setTimeout(finishOB,2200);return`<div class="ob" style="text-align:center"><div class="loader"></div><h2>Creating your plan…</h2><p class="muted">Calculating calories, body fat & quests</p></div>`}
 const s=OBSTEPS[st],v=OB.d[s.k];
 return`<div class="ob"><div class="flex" style="flex:none">${st?`<button class="iconbtn" style="flex:none" onclick="OB.step--;render('pop')">‹</button>`:'<span style="flex:none;width:40px"></span>'}<div class="obbar" style="margin:0"><i style="width:${(st+1)/OBSTEPS.length*100}%"></i></div><span class="muted" style="flex:none">${st+1}/${OBSTEPS.length}</span></div>
 <div style="margin-top:26px"><h2>${s.q}</h2>${s.s?`<p class="muted">${s.s}</p>`:''}</div>
 ${s.txt?`<input id="obt" style="margin-top:30px;font-size:22px;font-weight:800" maxlength="30" placeholder="Your name" value="${esc(v||'')}"><div style="flex:1"></div><button class="btn" onclick="const n=$('#obt').value.trim();if(!n)return toast('Enter a name');OB.d.name=n;OB.step++;render('push')">Continue</button>${!S.profile?`<button class="btn sec2" style="margin-top:10px" onclick="importSheet()">I have a backup — restore</button>`:''}`:s.o?`<div class="stagger" style="margin-top:14px">${s.o.map(([val,e,t,sub])=>`<div class="opt ${v==val?'on':''}" onclick="OB.d['${s.k}']=${typeof val==='number'?val:`'${val}'`};setTimeout(()=>{OB.step++;render('push')},180);this.classList.add('on')"><span class="e">${e}</span><div><b>${t}</b>${sub?`<small>${sub}</small>`:''}</div></div>`).join('')}</div>`
 :`<div class="bignum"><button onclick="nb(-1)">−</button><input id="obn" type="number" inputmode="decimal" value="${v??s.n[0]}"><button onclick="nb(1)">+</button></div><div class="unit">${s.n[1]}</div><div style="flex:1"></div><button class="btn" onclick="obNum()">Continue</button>`}</div>`};
function nb(d){const s=OBSTEPS[OB.step],i=$('#obn');i.value=+(Math.min(s.n[3],Math.max(s.n[2],(+i.value||s.n[0])+d*s.n[4]))).toFixed(1);vib(8)}
function obNum(){const s=OBSTEPS[OB.step],v=+$('#obn').value;if(!v||v<s.n[2]||v>s.n[3])return toast(`Enter ${s.n[2]}–${s.n[3]} ${s.n[1]}`);OB.d[s.k]=v;OB.step++;render('push')}
function finishOB(){if(!OB.active)return;const first=!S.profile;const d=OB.d;S.profile={...S.profile,...d};if(d.focus&&d.focus!=='none'&&!(d.focus in S.quests))S.quests[d.focus]=0;
 if(first)S.weights.push([Date.now(),d.weight]);OB.active=false;save();stack=[];tab='plan';if(first)push('result');else{render('fade');toast('Plan updated ✅')}}
V.result=()=>{const t=targets(),b=bodyFat(),p=S.profile;setTimeout(()=>confetti(40),400);
 return`<div class="top"><h1>Your plan is ready 🎉</h1></div>
 <div class="card stagger" style="text-align:center"><p class="muted">Daily calorie target</p><div class="big" style="font-size:52px;color:var(--acc)" data-count="${t.kcal}">0</div><p class="muted">kcal / day</p></div>
 <div class="grid2 stagger"><div class="stat"><small>Maintenance</small><b data-count="${t.tdee}">0</b></div><div class="stat"><small>${t.adj<0?'Daily deficit':t.adj>0?'Daily surplus':'Balance'}</small><b>${Math.abs(t.adj)}</b></div>
 <div class="stat"><small>Protein</small><b>${t.protein} g</b></div><div class="stat"><small>Body fat</small><b data-count="${b.bf.toFixed(1)}" data-dec="1">0</b></div>
 <div class="stat"><small>Water</small><b>${(t.water/1000).toFixed(1)} L</b></div><div class="stat"><small>Steps</small><b>${t.steps.toLocaleString()}</b></div></div>
 <div class="card" style="margin-top:14px"><b>Expected:</b> <span class="muted">${t.adj?`${(Math.abs(t.adj)*7/7700).toFixed(2)} kg ${t.adj<0?'lost':'gained'} per week`:'Maintain weight while getting stronger'}</span></div>
 <div class="sticky"><button class="btn" onclick="go('plan')">Let's go 🚀</button></div>`};

// ================= PLAN (daily checklist) =================
function shiftDay(n){const d=new Date(viewDate+'T12:00');d.setDate(d.getDate()+n);if(iso(d)>today())return;viewDate=iso(d);render('fade')}
function row({done,e,bg,t,s,p,on,right}){return`<div class="row" onclick="${on}"><div class="check ${done?'on':''}"></div><div class="tile" style="background:${bg}">${e}</div><div class="rbody"><b>${t}</b><small>${s}</small>${p!=null?`<div class="prog"><i style="width:${Math.min(100,p*100)}%"></i></div>`:''}</div>${right||'<span class="chev">›</span>'}</div>`}
V.plan=()=>{const t=targets(),d=viewDate,isT=d===today(),f=dayFood(d),k=sum(f,1),L=level();
 const wk=S.workouts.filter(w=>iso(w.ts)===d),pk=todaysProg(),P=PROGS[pk];
 const water=S.water[d]||0,steps=(S.steps[d]||0),qs=questList().filter(q=>q.i<q.steps.length);
 const wIn=S.weights.some(w=>iso(w[0])===d);const dd=new Date(d+'T12:00');
 return`<p class="muted" style="padding-top:18px;margin-bottom:-14px">Hi, ${esc(S.profile.name||'champ')} 👋</p><div class="top"><h1>My Plan</h1><div class="flex" style="flex:none"><span class="chip">⚡ ${streak()}</span><span class="chip" onclick="push('levelinfo')">Lv ${L.lvl}</span></div></div>
 <div class="datenav"><button class="iconbtn" onclick="shiftDay(-1)">‹</button><div><b>${isT?'Today':dd.toLocaleDateString(undefined,{weekday:'long'})}</b><small>${dd.toLocaleDateString(undefined,{weekday:'long',month:'short',day:'numeric'})}</small></div><button class="iconbtn" style="opacity:${isT?.3:1}" onclick="shiftDay(1)">›</button></div>
 <div class="list stagger">
 ${row({done:k>=t.kcal*.85,e:'🥗',bg:'#dcfce7',t:'Add Food',s:`${k.toLocaleString()} of ${t.kcal.toLocaleString()} cal`,p:k/t.kcal,on:"go('meals')"})}
 ${row({done:wk.length>0,e:P.e,bg:P.bg,t:wk.length?'Workout done 💪':'Do Your Workout',s:wk.length?`+${wk.reduce((s,w)=>s+w.xp,0)} XP earned`:`${P.name} · ~45 mins`,on:wk.length?"go('workouts')":`push('prog','${pk}')`})}
 ${qs.map(q=>row({done:false,e:q.icon,bg:'#fef3c7',t:'Quest Checkpoint',s:`${q.steps[q.i][1]}× ${q.steps[q.i][0]} · ${q.i}/${q.steps.length}`,p:q.i/q.steps.length,on:`push('quest','${q.id}')`})).join('')}
 ${row({done:water>=t.water,e:'💧',bg:'#e0f2fe',t:'Water Tracker',s:`${water.toLocaleString()} of ${t.water.toLocaleString()} ml`,p:water/t.water,on:'addWater(250)',right:`<button class="btn sm" onclick="event.stopPropagation();addWater(250)">+250</button>`})}
 ${row({done:steps>=t.steps,e:'👟',bg:'#fce7f3',t:'Walk',s:`${steps.toLocaleString()} of ${t.steps.toLocaleString()} steps`,p:steps/t.steps,on:"go('run')"})}
 ${row({done:wIn,e:'⚖️',bg:'#ede9fe',t:'Weigh-in',s:wIn?`${S.weights.filter(w=>iso(w[0])===d).at(-1)[1]} kg logged`:'Track your progress',on:'weighIn()'})}
 </div>
 <div class="card" style="margin-top:14px;background:linear-gradient(135deg,#fff0f3,#fff7ed)"><b>💬 ${CHEERS[dayIdx()%CHEERS.length]}</b></div>
 ${sciCard(SCIENCE[dayIdx()%SCIENCE.length],'🔬 Science tip of the day')}
 <div class="sec">💡 Tips for you</div>${tips().slice(0,3).map(x=>`<div class="tip">${x}</div>`).join('')}`};
function sciCard([e,t,txt,src],head){return`<div class="card"><small class="muted" style="font-weight:800">${head||''}</small><div class="flex" style="align-items:flex-start;margin-top:6px"><span style="font-size:30px;flex:none">${e}</span><div><b>${t}</b><p style="font-size:14px;margin:4px 0;line-height:1.45">${txt}</p><small class="muted">📚 ${src}</small></div></div></div>`}
V.science=()=>`<div class="top">${backBtn()}<h1>Science library</h1><span></span></div><p class="muted" style="margin-bottom:12px">Evidence-based tips from peer-reviewed research.</p><div class="stagger">${SCIENCE.map(s=>sciCard(s)).join('')}</div>`;
function addWater(ml){S.water[viewDate]=(S.water[viewDate]||0)+ml;save();render();xpFly('💧 +'+ml)}
function weighIn(){openSheet(`<h3 style="font-size:20px">Weigh-in ⚖️</h3><p class="muted">Morning, after the bathroom, before eating.</p><input id="wi" type="number" step="0.1" inputmode="decimal" value="${S.profile.weight}"><button class="btn" style="margin-top:10px" onclick="saveWeight()">Save</button>`)}
function saveWeight(){const v=+$('#wi').value;if(!v)return;const prev=S.profile.weight;S.weights.push([new Date(viewDate+'T'+new Date().toTimeString().slice(0,8)).getTime(),v]);S.weights.sort((a,b)=>a[0]-b[0]);if(viewDate===today())S.profile.weight=v;save();closeSheet();render();
 toast(v<prev?`📉 ${(prev-v).toFixed(1)} kg down! Great job!`:v>prev?`📈 +${(v-prev).toFixed(1)} kg`:'Weight saved ✅')}
function tips(){const t=targets(),f=dayFood(today()),k=sum(f,1),p=sum(f,2),out=[];
 const neg=MUSCLES.filter(m=>{const d=daysSince(m);return d===null||d>=5});if(neg.length&&S.workouts.length)out.push(`Not trained in 5+ days: <b>${neg.slice(0,4).join(', ')}</b>`);
 if(p<t.protein*.5&&new Date().getHours()>=14)out.push(`Behind on protein (${p}/${t.protein}g) — add chicken, tuna, eggs or a whey shake.`);
 if(k>t.kcal)out.push(`${k-t.kcal} kcal over target. A 30–45 min walk burns ~150–250 kcal 👟`);
 out.push('Progressive overload = more XP. Beat last session by +1 rep or +2.5 kg for a <b>2× PR bonus</b> 🏅');
 const low=MUSCLES.reduce((a,m)=>S.xp[m]<S.xp[a]?m:a);out.push(`Weakest rank: <b>${low}</b> (${rankOf(S.xp[low]).name}). Give it extra sets!`);
 if(S.profile.goal.includes('cut'))out.push('On a cut, keep lifting heavy to hold muscle and hit your step goal.');return out}
V.levelinfo=()=>{const L=level();return`<div class="top">${backBtn()}<h1>Level ${L.lvl}</h1><span></span></div>
 <div class="card"><div class="big" data-count="${L.total}">0</div><p class="muted">total XP</p><div class="prog" style="height:10px"><i style="width:${L.cur/L.need*100}%"></i></div><p class="muted" style="margin-top:6px">${L.cur} / ${L.need} XP to level ${L.lvl+1}</p></div>
 <div class="card"><h3>How to earn XP</h3><div class="tip">🏋️ Every set: 10 + volume/10 XP</div><div class="tip">🏅 New PR (heavier or more reps): <b>2× XP + 25</b></div><div class="tip">⚔️ Quest checkpoints: 100–650 bonus XP</div><div class="tip">💪 Main muscles get full XP, helper muscles get half</div></div>`};

V.workouts=()=>{const pk=todaysProg(),r=(k,feat)=>{const P=PROGS[k];return`<div class="row ${feat?'feat':''}" onclick="push('prog','${k}')"><div class="tile" style="background:${P.bg}">${P.e}</div><div class="rbody"><b>${P.name}</b><small>${P.ex.length?P.ex.length+' exercises · '+P.sub:P.sub}</small></div><span class="chev">›</span></div>`};
 return`<div class="top"><h1>Workouts</h1>${S.active?`<button class="btn sm" onclick="push('player')">Resume ▶</button>`:''}</div>

let RUN=null,pedo={on:false,last:0,avg:9.8,peak:false};
function stepDetect(e){const g=e.accelerationIncludingGravity;if(!g)return;const m=Math.sqrt(g.x*g.x+g.y*g.y+g.z*g.z);pedo.avg=pedo.avg*.9+m*.1;const t=Date.now();
 if(!pedo.peak&&m>pedo.avg+2.2&&t-pedo.last>280){pedo.peak=true;pedo.last=t;S.steps[today()]=(S.steps[today()]||0)+1;if(RUN)RUN.steps++;
  if(S.steps[today()]%20===0){save();const el=$('#stepnow');if(el)el.textContent=S.steps[today()].toLocaleString()}}
 else if(pedo.peak&&m<pedo.avg)pedo.peak=false}
async function startPedo(){if(pedo.on)return;try{if(typeof DeviceMotionEvent!=='undefined'&&DeviceMotionEvent.requestPermission)await DeviceMotionEvent.requestPermission()}catch(e){}
 window.addEventListener('devicemotion',stepDetect);pedo.on=true;S.pedoOn=true;save();render()}
function stopPedo(){window.removeEventListener('devicemotion',stepDetect);pedo.on=false;S.pedoOn=false;save();render()}
function hav(a,b){const R=6371e3,r=x=>x*Math.PI/180,dl=r(b[0]-a[0]),dn=r(b[1]-a[1]),h=Math.sin(dl/2)**2+Math.cos(r(a[0]))*Math.cos(r(b[0]))*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
const fmtT=s=>{s=Math.floor(s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return(h?h+':':'')+String(m).padStart(h?2:1,'0')+':'+String(x).padStart(2,'0')};
const pace=(sec,m)=>m>50?fmtT(sec/(m/1000)):'–:––';
function routeSVG(pts,live){if(pts.length<2)return`<div style="display:grid;place-items:center;height:100%;color:var(--muted);font-weight:700">${live?'📡 Waiting for GPS… go outside for a better signal':'No route'}</div>`;
 const la=pts.map(p=>p[0]),lo=pts.map(p=>p[1]),mnA=Math.min(...la),mxA=Math.max(...la),mnO=Math.min(...lo),mxO=Math.max(...lo),k=Math.cos(mnA*Math.PI/180);
 const sp=Math.max((mxA-mnA),(mxO-mnO)*k,1e-5),W=320,H=240,pad=24,X=o=>pad+((o-mnO)*k/sp)*(W-pad*2)+((W-pad*2)-((mxO-mnO)*k/sp)*(W-pad*2))/2,Y=a=>H-pad-((a-mnA)/sp)*(H-pad*2)-((H-pad*2)-((mxA-mnA)/sp)*(H-pad*2))/2;
 const d=pts.map(p=>`${X(p[1]).toFixed(1)},${Y(p[0]).toFixed(1)}`).join(' ');const e=pts.at(-1),s=pts[0];
 return`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:100%"><defs><pattern id="g" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#dfe5ee"/></pattern></defs><rect width="100%" height="100%" fill="url(#g)"/><polyline points="${d}" fill="none" stroke="#ff4f6d" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="${X(s[1])}" cy="${Y(s[0])}" r="7" fill="#22c55e" stroke="#fff" stroke-width="3"/><circle cx="${X(e[1])}" cy="${Y(e[0])}" r="8" fill="#ff4f6d" stroke="#fff" stroke-width="3">${live?'<animate attributeName="r" values="7;11;7" dur="1.4s" repeatCount="indefinite"/>':''}</circle></svg>`}
V.run=()=>{const t=targets(),st=S.steps[today()]||0,km=st*0.00076,kc=Math.round(st*0.04*(S.profile.weight/70));
 const tot=S.runs.reduce((s,r)=>s+r.dist,0);
 return`<div class="top"><h1>Activity</h1><span class="chip">👟 ${(tot/1000).toFixed(1)} km total</span></div>
 <div class="card" style="text-align:center">${ring(st/t.steps,'#ff4f6d',`<div class="big" id="stepnow">${st.toLocaleString()}</div><div class="muted">of ${t.steps.toLocaleString()} steps</div>`)}

 ${pedo.on?`<button class="btn sec2" onclick="stopPedo()">⏸ Pause step counter</button><p class="muted" style="margin-top:8px">Counting steps while the app is open 👟</p>`:`<button class="btn" onclick="startPedo()">▶ Start step counter</button><p class="muted" style="margin-top:8px">Uses your phone's motion sensor.</p>`}

function addStepsManual(){openSheet(`<h3 style="font-size:20px">Steps today</h3><p class="muted">From your watch or phone health app</p><input id="ms" type="number" value="${S.steps[today()]||0}"><button class="btn" style="margin-top:10px" onclick="S.steps[today()]=+$('#ms').value||0;save();closeSheet();render()">Save</button>`)}
function weekSteps(){const v=[],l=[];for(let i=6;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);v.push(S.steps[iso(d)]||0);l.push(d.toLocaleDateString(undefined,{weekday:'narrow'}))}return[v,l]}
function startRun(type){if(!navigator.geolocation)return toast('GPS not available');RUN={type,ts:Date.now(),pts:[],dist:0,steps:0,paused:false,el:0,lastTick:Date.now()};
 if(!pedo.on)startPedo();
 RUN.watch=navigator.geolocation.watchPosition(p=>{if(!RUN||RUN.paused)return;const c=[p.coords.latitude,p.coords.longitude];if(p.coords.accuracy>35)return;
  const l=RUN.pts.at(-1);if(l){const d=hav(l,c);if(d<3)return;RUN.dist+=d}RUN.pts.push(c);if(stack.at(-1)?.[0]==='runlive')render()},e=>toast('📡 GPS: '+e.message),{enableHighAccuracy:true,maximumAge:0,timeout:20000});
 RUN.timer=setInterval(()=>{if(!RUN.paused)RUN.el+=(Date.now()-RUN.lastTick)/1000;RUN.lastTick=Date.now();const e=$('#rtime');if(e)e.textContent=fmtT(RUN.el)},1000);stack=[];push('runlive')}
V.runlive=()=>{const R=RUN;if(!R)return V.run();return`<div class="top"><span class="chip">${R.type==='run'?'🏃 Running':'🚶 Walking'}</span><span class="chip" style="color:${R.paused?'var(--warn)':'var(--good)'}">● ${R.paused?'Paused':'Live'}</span></div>

 <div class="runstats"><div><b id="rtime">${fmtT(R.el)}</b><small>TIME</small></div><div><b>${pace(R.el,R.dist)}</b><small>PACE /KM</small></div><div><b>${R.steps}</b><small>STEPS</small></div></div></div>

 <input id="fn" placeholder="Food name" value="${esc(pre.name||'')}"><div class="flex"><input id="fk" type="number" placeholder="kcal" value="${pre.kcal??''}"><input id="fp" type="number" placeholder="protein g" value="${pre.protein??''}"><input id="fx" type="number" value="1" step="0.5" placeholder="servings"></div>

function addFood(){const n=$('#fn').value.trim(),x=+$('#fx').value||1,k=Math.round((+$('#fk').value||0)*x),p=Math.round((+$('#fp').value||0)*x);if(!n||!k)return toast('Enter name and kcal');
 (S.food[viewDate]??=[]).push([x!==1?`${n} ×${x}`:n,k,p]);save();closeSheet();render();xpFly(`+${k} kcal`)}
async function analyzePhoto(inp){const f=inp.files[0];if(!f)return;const out=$('#aiout');
 if(!S.apiKey){S.apiKey=prompt('Paste your Anthropic API key (stored only on this phone). Get one at console.anthropic.com');if(!S.apiKey)return;save()}
 out.innerHTML='<div class="card" style="text-align:center;margin-top:14px"><div class="loader" style="width:50px;height:50px;border-width:5px;margin:10px auto"></div><b>Analyzing your meal…</b></div>';
 const b64=await new Promise(r=>{const img=new Image();img.onload=()=>{const c=document.createElement('canvas'),s=Math.min(1,1024/Math.max(img.width,img.height));c.width=img.width*s;c.height=img.height*s;c.getContext('2d').drawImage(img,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',.8).split(',')[1])};img.src=URL.createObjectURL(f)});
 try{const res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'content-type':'application/json','x-api-key':S.apiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
  body:JSON.stringify({model:'claude-sonnet-5-5',max_tokens:500,messages:[{role:'user',content:[{type:'image',source:{type:'base64',media_type:'image/jpeg',data:b64}},{type:'text',text:'Identify the food in this photo and estimate the portion. Reply ONLY with JSON: {"recognized":true|false,"name":"short description","kcal":number,"protein":number}. If it is not food or unclear, set recognized false.'}]}]})});
  const j=await res.json();if(!res.ok){if(res.status===401){S.apiKey=null;save()}throw new Error(j.error?.message||res.status)}
  const d=JSON.parse(j.content[0].text.match(/\{[\s\S]*\}/)[0]);out.innerHTML='';
  if(!d.recognized){toast("🤔 Couldn't recognize that — enter it manually");foodSheet();return}
  foodSheet({name:d.name,kcal:Math.round(d.kcal),protein:Math.round(d.protein)});toast(`🍽️ Looks like ${esc(d.name)} — check & add`)}
 catch(e){out.innerHTML='';toast('⚠️ AI failed: '+esc(e.message));foodSheet()}inp.value=''}
function deficitSeries(days=30){const t=targets();let c=0;const v=[],l=[];for(let i=days-1;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);const k=sum(dayFood(iso(d)),1);if(k)c+=t.tdee-k;v.push(c);l.push(d.getDate())}return[v,l,c]}

 <div class="sec">🏆 Muscle Ranks</div><div class="grid2 stagger">${MUSCLES.map(m=>{const r=rankOf(S.xp[m]),d=daysSince(m);return`<div class="stat"><small>${m}</small><b style="font-size:16px;color:${r.color}">${r.name}</b><div class="prog"><i style="width:${r.cur/r.need*100}%;background:${r.color}"></i></div><small style="text-transform:none;font-weight:600">${r.cur}/${r.need} XP${d!=null?` · ${d}d ago`:''}</small></div>`}).join('')}</div>

 <div class="sec">🏅 Personal Records</div><div class="list">${Object.keys(EX).map(e=>[e,bestSet(e)]).filter(x=>x[1]).map(([e,b])=>`<div class="row" style="cursor:default"><span style="font-size:22px">${EX[e][2]}</span><div class="rbody"><b>${e}</b><small>e1RM ${Math.round(e1rm(b.w,b.r))} kg</small></div><b>${b.w}kg × ${b.r}</b></div>`).join('')||'<div class="row muted" style="cursor:default">Log sets to set PRs.</div>'}</div>`};
function newQuest(){openSheet(`<h3 style="font-size:20px">New challenge</h3>${Object.keys(TREES).filter(id=>!(id in S.quests)).map(id=>`<div class="opt" onclick="S.quests['${id}']=0;save();closeSheet();push('quest','${id}')"><span class="e">${TREES[id].icon}</span><div><b>${TREES[id].name}</b><small>${TREES[id].steps.length} checkpoints</small></div></div>`).join('')}
 <h3 style="margin-top:14px">🎯 Custom goal</h3><select id="cqe">${Object.keys(EX).map(e=>`<option>${e}</option>`).join('')}</select><div class="flex"><input id="cqs" type="number" placeholder="Current max reps"><input id="cqt" type="number" placeholder="Goal reps"></div><button class="btn" style="margin-top:8px" onclick="addCustom()">Create</button>`)}
function addCustom(){const ex=$('#cqe').value,start=+$('#cqs').value||0,target=+$('#cqt').value;if(!target||target<=start)return toast('Goal must be above your current max');S.custom.push({ex,start,target,i:0});save();closeSheet();render()}
V.quest=id=>{const q=questList().find(x=>x.id===id);if(!q)return V.challenges();const done=q.i>=q.steps.length;
 return`<div class="top">${backBtn()}<span class="chip">${q.i}/${q.steps.length}</span></div>
 <div style="text-align:center;margin-bottom:18px"><div style="font-size:64px;animation:bounce .5s">${q.icon}</div><h1 style="font-size:24px">${esc(q.name)}</h1><div class="prog" style="height:8px;margin:10px 30px"><i style="width:${q.i/q.steps.length*100}%"></i></div></div>
 <div class="card stagger">${q.steps.map(([e,n,t],k)=>`<div class="node ${k<q.i?'done':k===q.i?'cur':''}"><div class="dot">${k<q.i?'✓':k===q.i?'⚔️':'🔒'}</div><div style="flex:1;opacity:${k>q.i?.5:1}"><b>${n}× ${esc(e)}</b>${k===q.i?`<p class="muted" style="margin:4px 0 8px">${t}</p><button class="btn sm" onclick="testCP('${q.id}')">I did it — test</button>`:''}${k<q.i?'<br><small class="muted">Cleared</small>':''}</div></div>`).join('')}</div>
 ${done?'<div class="card" style="text-align:center"><div class="big">🏆</div><b>Quest complete — legend!</b></div>':''}
 <button class="btn sec2" onclick="if(confirm('Abandon this challenge?')){${id[0]==='c'?`S.custom.splice(${id.slice(1)},1)`:`delete S.quests['${id}']`};save();back()}">Abandon</button><div style="height:20px"></div>`};
function testCP(id){const q=questList().find(x=>x.id===id),[e,n]=q.steps[q.i];openSheet(`<h3 style="font-size:20px">Checkpoint test</h3><p class="muted">How many <b>${esc(e)}</b> did you do in one set? Goal: ${n}</p><input id="tc" type="number" inputmode="numeric"><button class="btn" style="margin-top:10px" onclick="doTest('${id}')">Submit</button>`)}
function doTest(id){const q=questList().find(x=>x.id===id),[e,n]=q.steps[q.i],r=parseInt($('#tc').value);if(!r)return;closeSheet();const m=checkQuests(e,r);save();render();toast(m.length?m.join('<br>'):`${r}/${n} — so close! Keep training 💪`)}

// ================= MORE =================
function chart(vals,labels,{type='bar',color='#ff4f6d',emoji=''}={}){if(!vals.length||vals.every(v=>!v))return'<p class="muted" style="text-align:center;padding:20px 0">Not enough data yet — keep going! 🌱</p>';
 const W=320,H=150,P=20,mx=Math.max(...vals.map(Math.abs),1),mn=type==='line'?Math.min(...vals,0):0,n=vals.length,bw=(W-P*2)/n,y=v=>H-P-((v-mn)/(mx-mn||1))*(H-P*2);let s=`<svg viewBox="0 0 ${W} ${H}" style="width:100%">`;
 if(type==='bar')vals.forEach((v,i)=>{const hh=Math.max(3,(Math.abs(v)/mx)*(H-P*2));s+=`<rect x="${P+i*bw+4}" y="${H-P-hh}" width="${bw-8}" height="${hh}" rx="7" fill="${color}" opacity="${i===n-1?1:.55}"><animate attributeName="height" from="0" to="${hh}" dur=".7s"/><animate attributeName="y" from="${H-P}" to="${H-P-hh}" dur=".7s"/></rect>`;if(v)s+=`<text x="${P+i*bw+bw/2}" y="${H-P-hh-5}" fill="#555" font-size="10" font-weight="700" text-anchor="middle">${v>=1000?(v/1000).toFixed(1)+'k':Math.round(v)}</text>`});
 else{const pts=vals.map((v,i)=>`${P+i*bw+bw/2},${y(v)}`);s+=`<polygon points="${P+bw/2},${H-P} ${pts.join(' ')} ${P+(n-1)*bw+bw/2},${H-P}" fill="${color}" opacity=".12"/><polyline points="${pts.join(' ')}" fill="none" stroke="${color}" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="2000" stroke-dashoffset="2000"><animate attributeName="stroke-dashoffset" to="0" dur="1.4s" fill="freeze"/></polyline>`;
  const l=n-1;s+=`<circle cx="${P+l*bw+bw/2}" cy="${y(vals[l])}" r="5" fill="${color}"/><text x="${P+l*bw+bw/2}" y="${y(vals[l])-10}" font-size="18" text-anchor="middle">${emoji}</text>`}
 labels.forEach((lb,i)=>{if(n<=8||i%Math.ceil(n/8)===0)s+=`<text x="${P+i*bw+bw/2}" y="${H-4}" fill="#9a9aab" font-size="9" text-anchor="middle">${lb}</text>`});return s+'</svg>'}
function weeklyXP(){const v=[],l=[];for(let i=7;i>=0;i--){const end=Date.now()-i*7*864e5,st=end-7*864e5;v.push(S.workouts.filter(w=>w.ts>st&&w.ts<=end).reduce((s,w)=>s+w.xp,0));l.push(i?`-${i}w`:'now')}return[v,l]}
function liftSeries(ex){const v=[],l=[];S.workouts.forEach(w=>{const ss=w.sets.filter(s=>s.ex===ex);if(ss.length){v.push(Math.max(...ss.map(s=>e1rm(s.w,s.r))));l.push(new Date(w.ts).getDate()+'/'+(new Date(w.ts).getMonth()+1))}});return[v.slice(-12),l.slice(-12)]}
let chartEx=null;
V.more=()=>{const p=S.profile,t=targets(),b=bodyFat(),lean=p.weight*(1-b.bf/100);const [xv,xl]=weeklyXP();const done=Object.keys(EX).filter(e=>bestSet(e));chartEx=done.includes(chartEx)?chartEx:done[0];const [lv,ll]=chartEx?liftSeries(chartEx):[[],[]];const gain=lv.length>1?Math.round((lv.at(-1)/lv[0]-1)*100):0;
 const ws=S.weights.slice(-20);const goalBF=p.sex==='m'?15:23;
 return`<div class="top"><h1>Progress</h1><button class="iconbtn" onclick="push('settings')">⚙️</button></div>
 <div class="card flex"><div class="tile" style="background:#ffe4e6;flex:none">${p.sex==='m'?'🧔':'👩'}</div><div><b style="font-size:18px">Level ${level().lvl} athlete</b><p class="muted">${p.weight} kg · ${p.height} cm · ${({cut:'Losing fat',slowcut:'Slow cut',maintain:'Toning',bulk:'Building muscle'})[p.goal]}</p></div></div>
 <div class="sec">🧬 Body composition</div><div class="grid2 stagger"><div class="stat"><small>Body fat</small><b data-count="${b.bf.toFixed(1)}" data-dec="1">0</b><small style="text-transform:none">${bfLabel(b.bf,p.sex)}</small></div><div class="stat"><small>Lean mass</small><b>${lean.toFixed(1)} kg</b></div><div class="stat"><small>BMI</small><b>${b.bmi.toFixed(1)}</b></div><div class="stat"><small>Fat to ${goalBF}%</small><b>${Math.max(0,p.weight-lean/(1-goalBF/100)).toFixed(1)} kg</b></div></div>
 <p class="muted" style="margin-top:8px">${b.method}</p>
 <div class="sec">📊 Plan</div><div class="list"><div class="row" style="cursor:default"><div class="rbody"><b>Calorie target</b></div><b>${t.kcal} kcal</b></div><div class="row" style="cursor:default"><div class="rbody"><b>Maintenance (TDEE)</b></div><b>${t.tdee}</b></div><div class="row" style="cursor:default"><div class="rbody"><b>${t.adj<0?'Daily deficit':'Daily surplus'}</b></div><b>${Math.abs(t.adj)}</b></div><div class="row" style="cursor:default"><div class="rbody"><b>Protein</b></div><b>${t.protein} g</b></div></div>
 <div class="sec">⚖️ Weight</div><div class="card">${chart(ws.map(w=>w[1]),ws.map(w=>new Date(w[0]).getDate()),{type:'line',color:'#a855f7',emoji:ws.length>1&&ws.at(-1)[1]<ws[0][1]?'📉':'⚖️'})}${ws.length>1?`<p class="muted">${(ws.at(-1)[1]-ws[0][1]).toFixed(1)} kg since ${new Date(ws[0][0]).toLocaleDateString()}</p>`:''}</div>
 <div class="sec">⚡ XP per week</div><div class="card">${chart(xv,xl,{color:'#3b82f6'})}${xv.at(-1)>xv.at(-2)?'<p class="muted">🔥 Beating last week — keep it up!</p>':''}</div>
 <div class="sec">📈 Strength</div><div class="card">${done.length?`<select onchange="chartEx=this.value;render()">${done.map(e=>`<option ${e===chartEx?'selected':''}>${e}</option>`).join('')}</select>${chart(lv,ll,{type:'line',color:'#22c55e',emoji:'💪'})}<p class="muted">Estimated 1-rep max${gain>0?` · <b style="color:var(--good)">+${gain}% stronger!</b> 🚀`:''}</p>`:'<p class="muted">Log a workout to see your strength curve 🌱</p>'}</div>`};
V.settings=()=>{const p=S.profile;return`<div class="top">${backBtn()}<h1>Settings</h1><span></span></div>
 <div class="list"><div class="row" onclick="startOB()"><span style="font-size:22px">👤</span><div class="rbody"><b>Redo my plan</b><small>Goal, age, height, weight, activity</small></div><span class="chev">›</span></div>
 <div class="row" onclick="measSheet()"><span style="font-size:22px">📏</span><div class="rbody"><b>Body measurements</b><small>Waist, neck, hip → accurate body fat</small></div><span class="chev">›</span></div>
 <div class="row" onclick="S.apiKey=prompt('Anthropic API key',S.apiKey||'')||null;save();toast('Saved')"><span style="font-size:22px">🤖</span><div class="rbody"><b>AI photo key</b><small>${S.apiKey?'Set ✓':'Not set'}</small></div><span class="chev">›</span></div>

function measSheet(){const p=S.profile;openSheet(`<h3 style="font-size:20px">Measurements (cm)</h3><p class="muted">Waist at navel, neck below Adam's apple, hip at widest (women).</p><input id="mw" type="number" step="0.1" placeholder="Waist" value="${p.waist||''}"><input id="mn" type="number" step="0.1" placeholder="Neck" value="${p.neck||''}"><input id="mh" type="number" step="0.1" placeholder="Hip (women)" value="${p.hip||''}"><button class="btn" style="margin-top:10px" onclick="S.profile.waist=+$('#mw').value||0;S.profile.neck=+$('#mn').value||0;S.profile.hip=+$('#mh').value||0;save();closeSheet();render();toast('Body fat updated 🧬')">Save</button>`)}
// ---- account transfer (no server: file or code) ----
function payload(){const d={...S};delete d.apiKey;delete d.active;return JSON.stringify({app:'gymquest',v:1,exported:Date.now(),data:d})}
async function gz(str,dir){const s=new Blob([str]).stream().pipeThrough(dir?new CompressionStream('gzip'):new DecompressionStream('gzip'));return new Response(s)}
async function makeCode(){const buf=new Uint8Array(await(await gz(payload(),1)).arrayBuffer());let b='';buf.forEach(x=>b+=String.fromCharCode(x));return'GQ1:'+btoa(b)}
async function readCode(code){code=code.trim().replace(/\s/g,'');if(!code.startsWith('GQ1:'))throw new Error('Not a GymQuest code');const bin=atob(code.slice(4)),u=Uint8Array.from(bin,c=>c.charCodeAt(0));return(await gz(u,0)).text()}
async function exportFile(){const json=payload(),name=`gymquest-${(S.profile.name||'backup').replace(/\W+/g,'_')}-${today()}.json`,P=window.Capacitor?.Plugins;
 try{if(P?.Filesystem&&P?.Share){const r=await P.Filesystem.writeFile({path:name,data:json,directory:'CACHE',encoding:'utf8'});await P.Share.share({title:'GymQuest backup',text:'My GymQuest progress',url:r.uri,dialogTitle:'Save or send your backup'});return}
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([json],{type:'application/json'}));a.download=name;a.click();toast('Backup saved 💾')}catch(e){if(!/cancel/i.test(e.message))toast('⚠️ '+e.message)}}
async function copyCode(){const c=await makeCode();$('#codebox').value=c;try{await navigator.clipboard.writeText(c);toast('📋 Code copied! Paste it on your other device')}catch(e){$('#codebox').select();toast('Select & copy the code below')}}
function restore(txt){let o;try{o=JSON.parse(txt)}catch(e){return toast('⚠️ That file is not a valid backup')}
 if(o.app!=='gymquest'||!o.data)return toast('⚠️ Not a GymQuest backup');
 if(S.profile&&!confirm(`Replace this device's progress with ${o.data.profile?.name||'the'} backup from ${new Date(o.exported).toLocaleDateString()}?`))return;
 const key=S.apiKey;S=o.data;if(key)S.apiKey=key;save();toast('✅ Account restored! Welcome back, '+esc(S.profile?.name||''));setTimeout(()=>location.reload(),1200)}
function importFile(inp){const f=inp.files[0];if(!f)return;f.text().then(restore);inp.value=''}
async function importCode(){try{restore(await readCode($('#codein').value))}catch(e){toast('⚠️ Invalid code')}}
function importSheet(){openSheet(`<h3 style="font-size:20px">Restore account</h3><label class="btn" style="text-align:center">📂 Choose backup file<input type="file" accept=".json,application/json" style="display:none" onchange="closeSheet();importFile(this)"></label><p class="muted" style="text-align:center;margin:10px 0">or paste a transfer code</p><textarea id="codein" rows="3" style="width:100%;border-radius:14px;border:1.5px solid var(--line);padding:12px;font-size:12px" placeholder="GQ1:..."></textarea><button class="btn sec2" style="margin-top:8px" onclick="importCode()">Restore from code</button>`)}
V.transfer=()=>`<div class="top">${backBtn()}<h1>Transfer</h1><span></span></div>
 <div class="card" style="text-align:center"><div style="font-size:56px">🔄</div><b>Your account lives on this phone</b><p class="muted">No sign-up, no server. To use GymQuest on another device, export here and import there.</p></div>
 <div class="sec">1. Send from this device</div>
 <button class="btn" onclick="exportFile()">📤 Export backup file</button><p class="muted" style="margin:6px 0 12px">Save to Drive, send via Messenger/email, or keep it as a backup.</p>
 <button class="btn sec2" onclick="copyCode()">📋 Copy transfer code</button><textarea id="codebox" readonly rows="3" style="width:100%;margin-top:8px;border-radius:14px;border:1.5px solid var(--line);padding:12px;font-size:11px" placeholder="Your code appears here"></textarea>
 <div class="sec">2. Receive on the new device</div><button class="btn sec2" onclick="importSheet()">📥 Import file or code</button>
 <p class="muted" style="margin:14px 0 30px">Tip: export a backup every week — if you lose your phone, your progress is safe. Your AI key is never included.</p>`;
V.privacy=()=>`<div class="top">${backBtn()}<h1>Privacy</h1><span></span></div>
 <div class="card"><h3>🔒 What GymQuest stores</h3><div class="tip">✅ Your name, body stats, workouts, food log, steps & runs</div><div class="tip">📱 All of it stays <b>only on this device</b> — there is no account server or database</div><div class="tip">🚫 No email, phone number, ads, trackers or analytics</div><div class="tip">📍 GPS routes are saved only on your phone</div><div class="tip">📸 Meal photos are sent to the AI only when you tap “Snap meal” (with your own key) and are not saved</div><div class="tip">🔄 Moving devices = export & import a file/code that you control</div></div>`;

// ================= BOOT =================
if(S.pedoOn)setTimeout(startPedo,500);
document.addEventListener('backbutton',e=>{if($('#sheet').classList.contains('show'))closeSheet();else if(stack.length)back();else if(tab!=='plan')go('plan')});
window.addEventListener('popstate',()=>{});
render('fade');
