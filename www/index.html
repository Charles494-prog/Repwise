<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="icon.png">
<link rel="stylesheet" href="vendor/leaflet/leaflet.css"><link rel="apple-touch-icon" href="icon.png"><title>RepWise — Be Wise in Every Rep</title>
<style>
:root{--bg:#f3f3f5;--card:#fff;--txt:#15151f;--muted:#878794;--line:#eeeef3;--acc:#e3262f;--acc2:#a50f17;--good:#22c55e;--warn:#f59e0b;--r:18px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;font-family:"Nunito","Poppins",system-ui,sans-serif}
html,body{background:var(--bg);color:var(--txt);overscroll-behavior:none}
body{padding:env(safe-area-inset-top) 0 calc(76px + env(safe-area-inset-bottom))}
body.full{padding-bottom:env(safe-area-inset-bottom)}
body.full nav{display:none}
#app{padding:0 16px;min-height:100vh}
.anim-fade{animation:fade .35s ease}
.anim-push{animation:push .35s cubic-bezier(.2,.8,.2,1)}
.anim-pop{animation:popback .35s cubic-bezier(.2,.8,.2,1)}
.anim-up{animation:up .45s cubic-bezier(.2,.8,.2,1)}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes push{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}
@keyframes popback{from{opacity:0;transform:translateX(-40px)}to{opacity:1;transform:none}}
@keyframes up{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:none}}
@keyframes bounce{0%{transform:scale(.6)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
@keyframes floatUp{0%{opacity:0;transform:translate(-50%,0) scale(.6)}20%{opacity:1;transform:translate(-50%,-20px) scale(1.1)}100%{opacity:0;transform:translate(-50%,-110px) scale(1)}}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.stagger>*{animation:fade .45s ease both}
.stagger>*:nth-child(2){animation-delay:.05s}.stagger>*:nth-child(3){animation-delay:.1s}.stagger>*:nth-child(4){animation-delay:.15s}.stagger>*:nth-child(5){animation-delay:.2s}.stagger>*:nth-child(6){animation-delay:.25s}.stagger>*:nth-child(7){animation-delay:.3s}.stagger>*:nth-child(8){animation-delay:.35s}.stagger>*:nth-child(n+9){animation-delay:.4s}
.top{display:flex;align-items:center;justify-content:space-between;padding:18px 0 12px}
.top h1{font-size:26px;font-weight:800}
.chip{display:inline-flex;align-items:center;gap:4px;background:#fff;border-radius:20px;padding:6px 12px;font-weight:800;font-size:14px;box-shadow:0 2px 10px #0000000d}
.iconbtn{width:40px;height:40px;border-radius:50%;border:none;background:#fff;box-shadow:0 2px 10px #0000000f;font-size:18px;display:grid;place-items:center;cursor:pointer}
.datenav{display:flex;align-items:center;justify-content:space-between;margin:4px 0 14px}
.datenav b{display:block;text-align:center;font-size:17px}.datenav small{display:block;text-align:center;color:var(--muted);font-size:13px}
.list{background:var(--card);border-radius:var(--r);overflow:hidden;box-shadow:0 4px 20px #0000000a}
.row{display:flex;align-items:center;gap:12px;padding:14px;border-bottom:1px solid var(--line);cursor:pointer;transition:background .15s,transform .15s}
.row:last-child{border-bottom:none}
.row:active{background:#fafafa;transform:scale(.985)}
.check{width:24px;height:24px;border-radius:50%;border:2px solid #d4d4de;flex:none;display:grid;place-items:center;transition:.25s}
.check.on{background:var(--good);border-color:var(--good);animation:bounce .4s}
.check.on::after{content:"✓";color:#fff;font-weight:900;font-size:14px}
.tile{width:58px;height:58px;border-radius:14px;flex:none;display:grid;place-items:center;font-size:30px}
.rbody{flex:1;min-width:0}.rbody b{font-size:16px;display:block}.rbody small{color:var(--muted);font-size:13px;display:block;margin-top:2px}
.chev{color:#c4c4d0;font-size:22px}
.prog{height:5px;background:#eeeef3;border-radius:3px;margin-top:8px;overflow:hidden}
.prog>i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,var(--acc),var(--acc2));transition:width .8s cubic-bezier(.2,.8,.2,1)}
.card{background:var(--card);border-radius:var(--r);padding:16px;margin-bottom:14px;box-shadow:0 4px 20px #0000000a}
.card h3{font-size:17px;margin-bottom:10px}
.sec{font-size:18px;font-weight:800;margin:20px 0 10px}
.muted{color:var(--muted);font-size:14px}
.btn{display:block;width:100%;padding:16px;border:none;border-radius:16px;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;font-size:17px;font-weight:800;cursor:pointer;box-shadow:0 8px 20px #e3262f40;transition:transform .12s}
.btn:active{transform:scale(.97)}
.btn.sec2{background:#fff;color:var(--txt);box-shadow:0 2px 10px #0000000f}
.btn.sm{display:inline-block;width:auto;padding:8px 14px;font-size:14px;border-radius:12px}
.sticky{position:sticky;bottom:calc(84px + env(safe-area-inset-bottom));margin-top:16px}
body.full .sticky{bottom:16px}
input,select{width:100%;padding:14px;border-radius:14px;border:1.5px solid var(--line);background:#fff;font-size:16px;margin:5px 0;color:var(--txt);outline:none}
input:focus,select:focus{border-color:var(--acc)}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.flex{display:flex;gap:10px;align-items:center}.flex>*{flex:1}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#fff;border-top:1px solid var(--line);padding:6px 0 calc(6px + env(safe-area-inset-bottom));z-index:5}
nav button{flex:1;background:none;border:none;color:#9b9bab;font-size:11px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
nav button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .2s}
nav button.on{color:var(--acc)}nav button.on svg{transform:translateY(-2px) scale(1.1)}
.feat{transform:scale(1.03);box-shadow:0 12px 30px #0000001a;border-radius:var(--r);background:#fff;position:relative;z-index:1;margin:6px 0 12px}
#toast{position:fixed;top:calc(16px + env(safe-area-inset-top));left:16px;right:16px;background:#1c1c28;color:#fff;padding:14px 18px;border-radius:16px;font-weight:700;z-index:30;transform:translateY(-150%);transition:transform .35s cubic-bezier(.2,.8,.2,1);text-align:center;font-size:15px}
#toast.show{transform:none}
.xpfly{position:fixed;left:50%;top:45%;font-size:34px;font-weight:900;color:var(--acc);z-index:40;pointer-events:none;animation:floatUp 1.3s ease-out forwards;text-shadow:0 4px 14px #e3262f55}
.confetti{position:fixed;top:-20px;width:10px;height:14px;z-index:50;pointer-events:none;animation:fall linear forwards;border-radius:2px}
#sheetbg{position:fixed;inset:0;background:#0006;z-index:20;opacity:0;pointer-events:none;transition:opacity .3s}
#sheetbg.show{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:0;right:0;bottom:0;background:#fff;border-radius:24px 24px 0 0;padding:10px 18px calc(24px + env(safe-area-inset-bottom));z-index:21;transform:translateY(105%);transition:transform .38s cubic-bezier(.2,.8,.2,1);max-height:88vh;overflow:auto}
#sheet.show{transform:none}
#sheet .grab{width:40px;height:5px;background:#ddd;border-radius:3px;margin:0 auto 14px}
/* onboarding */
.ob{min-height:100vh;display:flex;flex-direction:column;padding:16px 0 24px}
.obbar{height:6px;background:#eceef3;border-radius:3px;overflow:hidden;margin:10px 0 26px}
.obbar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));transition:width .5s}
.ob h2{font-size:27px;font-weight:800;margin-bottom:6px;line-height:1.2}
.opt{display:flex;align-items:center;gap:14px;background:#fff;border:2px solid transparent;border-radius:18px;padding:16px;margin:10px 0;cursor:pointer;box-shadow:0 2px 12px #0000000a;transition:.2s}
.opt:active{transform:scale(.98)}.opt.on{border-color:var(--acc);background:#fff5f7}
.opt .e{font-size:32px}.opt b{font-size:17px;display:block}.opt small{color:var(--muted)}
.bignum{display:flex;align-items:center;justify-content:center;gap:18px;margin:40px 0}
.bignum input{width:150px;text-align:center;font-size:54px;font-weight:900;border:none;background:none;padding:0}
.bignum button{width:56px;height:56px;border-radius:50%;border:none;background:#fff;font-size:28px;font-weight:800;box-shadow:0 4px 14px #00000014;cursor:pointer}
.unit{text-align:center;color:var(--muted);font-weight:700;margin-top:-30px}
.loader{width:120px;height:120px;border-radius:50%;border:10px solid #eee;border-top-color:var(--acc);animation:spin 1s linear infinite;margin:60px auto 30px}
.big{font-size:34px;font-weight:900}
.stat{background:#fff;border-radius:16px;padding:14px;box-shadow:0 2px 12px #0000000a}
.stat small{color:var(--muted);font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.4px}
.stat b{display:block;font-size:24px;font-weight:900;margin-top:2px}
/* quest path */
.node{display:flex;gap:12px;position:relative;padding-bottom:16px}
.node:not(:last-child)::before{content:"";position:absolute;left:19px;top:40px;bottom:0;width:3px;background:#eceef3}
.node.done:not(:last-child)::before{background:var(--good)}
.dot{width:40px;height:40px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:18px;background:#eceef3;z-index:1}
.node.done .dot{background:var(--good);color:#fff}
.node.cur .dot{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;animation:pulse 1.6s infinite}
.badge{display:inline-block;padding:3px 10px;border-radius:10px;font-size:12px;font-weight:800}
.segs{display:flex;gap:4px;margin:12px 0}.segs i{flex:1;height:5px;border-radius:3px;background:#e5e5ec}.segs i.on{background:var(--acc)}
.player-ex{text-align:center;padding:10px 0}
.player-ex .tile{width:110px;height:110px;font-size:60px;margin:10px auto;border-radius:28px;animation:bounce .5s}
.stepper{display:flex;align-items:center;background:#fff;border-radius:16px;padding:6px;box-shadow:0 2px 12px #0000000a}
.stepper button{width:44px;height:44px;border-radius:12px;border:none;background:#f3f3f7;font-size:22px;font-weight:800;cursor:pointer}
.stepper input{border:none;text-align:center;font-size:24px;font-weight:900;padding:4px;margin:0}
.stepper label{display:block}
.lbl{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;text-align:center;margin-bottom:4px}
.setrow{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);font-weight:700;animation:fade .3s}
.tip{background:#fff5f0;border-radius:14px;padding:12px 14px;margin:8px 0;font-size:14px;line-height:1.4}
.map{background:#eef2f7;border-radius:var(--r);height:240px;overflow:hidden;position:relative}
.runstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));gap:8px;text-align:center;margin:14px 0}
.runstats b{display:block;font-size:26px;font-weight:900}.runstats small{color:var(--muted);font-weight:700;font-size:12px}
</style>
</head>

// Progressive overload XP. Baselines: all-time best and LAST SESSION's best (weight + reps via score()).
// Beat all-time best -> PR (2x+25). Beat last session but still under your PR -> smaller "overload" bonus,
// scaled by how far below your PR you are (e.g. 13 -> 10 -> 11 earns less than a real PR). Only the first
// set that beats a baseline in a session gets the bonus (later sets compare to it).

 if(sb&&(!allT||score(sb.w,sb.r)>score(allT.w,allT.r)))allT=sb;if(sb&&last&&score(sb.w,sb.r)>score(last.w,last.r))last=sb;
 const sc=score(set.w,set.r);
 if(!allT)xp+=10;
 else if(sc>score(allT.w,allT.r)){xp=xp*2+25;pr=true}
 else if(last&&sc>score(last.w,last.r)){const close=Math.max(0,Math.min(1,set.w>0?e1rm(set.w,set.r)/e1rm(allT.w,allT.r):set.r/allT.r));xp=Math.round(xp*(1.1+0.4*close)+5);ov=true}
 return{xp,pr,ov}}

 ${s.multi?`<div class="stagger" style="margin-top:10px">${Object.keys(TREES).map(id=>`<div class="opt ${(OB.d.focus||[]).includes(id)?'on':''}" style="padding:12px;margin:8px 0" onclick="togFocus('${id}',this)"><span class="e" style="font-size:26px">${TREES[id].icon}</span><div><b>${TREES[id].name}</b><small>${TREES[id].cat} · ${TREES[id].steps.length} checkpoints</small></div></div>`).join('')}</div><div class="sticky" style="bottom:16px"><button class="btn" onclick="OB.step++;render('push')">${(OB.d.focus||[]).length?`Continue with ${(OB.d.focus||[]).length} quest${(OB.d.focus||[]).length>1?'s':''}`:'Skip for now'}</button></div>`:s.txt?`<input id="obt" style="margin-top:30px;font-size:22px;font-weight:800" maxlength="30" placeholder="Your name" value="${esc(v||'')}"><div style="flex:1"></div><button class="btn" onclick="const n=$('#obt').value.trim();if(!n)return toast('Enter a name');OB.d.name=n;OB.step++;render('push')">Continue</button>${!S.profile?`<button class="btn sec2" style="margin-top:10px" onclick="importSheet()">I have a backup — restore</button>`:''}`:s.o?`<div class="stagger" style="margin-top:14px">${s.o.map(([val,e,t,sub])=>`<div class="opt ${v==val?'on':''}" onclick="OB.d['${s.k}']=${typeof val==='number'?val:`'${val}'`};setTimeout(()=>{OB.step++;render('push')},180);this.classList.add('on')"><span class="e">${e}</span><div><b>${t}</b>${sub?`<small>${sub}</small>`:''}</div></div>`).join('')}</div>`
 :`<div class="bignum"><button onclick="nb(-1)">−</button><input id="obn" oninput="updBmi()" type="number" inputmode="decimal" value="${v??s.n[0]}"><button onclick="nb(1)">+</button></div><div class="unit">${s.n[1]}</div>${s.k==='weight'&&OB.d.height?`<div id="bmiw" style="margin-top:22px">${bmiMeter((v??s.n[0])/Math.pow(OB.d.height/100,2))}</div>`:''}<div style="flex:1"></div><button class="btn" onclick="obNum()">Continue</button>`}</div>`};
function togFocus(id,el){let f=Array.isArray(OB.d.focus)?OB.d.focus:[];f=f.includes(id)?f.filter(x=>x!==id):[...f,id];OB.d.focus=f;el.classList.toggle('on');const b=document.querySelector('.ob .sticky .btn');if(b)b.textContent=f.length?`Continue with ${f.length} quest${f.length>1?'s':''}`:'Skip for now';vib(8)}
function bmiMeter(b){const lo=15,hi=40,pos=Math.min(100,Math.max(0,(b-lo)/(hi-lo)*100));
 const c=b<18.5?['Underweight','#3b82f6','Below the healthy range — focus on eating enough and building muscle.']:b<25?['Healthy','#22c55e','Right in the healthy range. Nice!']:b<30?['Overweight','#f59e0b','A bit above the healthy range — a small calorie deficit will help.']:b<35?['Obese (Class I)','#f97316','Health risk is raised — steady fat loss will make a big difference.']:['Obese (Class II+)','#ef4444','High health risk — losing weight gradually is strongly recommended.'];
 const z=x=>(x-lo)/(hi-lo)*100;
 return`<div class="card" style="text-align:left"><div style="display:flex;justify-content:space-between;align-items:baseline"><span class="muted">Your BMI</span><b style="font-size:26px;color:${c[1]}">${b.toFixed(1)}</b></div>
 <div style="position:relative;margin:14px 0 6px;height:14px;border-radius:7px;background:linear-gradient(90deg,#3b82f6 0%,#3b82f6 ${z(18.5)-3}%,#22c55e ${z(18.5)+3}%,#22c55e ${z(25)-3}%,#f59e0b ${z(25)+3}%,#f59e0b ${z(30)-3}%,#f97316 ${z(30)+3}%,#f97316 ${z(35)-3}%,#ef4444 ${z(35)+3}%)">
 <i style="position:absolute;left:${pos}%;top:-6px;width:6px;height:26px;margin-left:-3px;border-radius:3px;background:#111;border:2px solid #fff;box-shadow:0 1px 4px #0005;transition:left .25s"></i></div>
 <div class="muted" style="position:relative;height:14px;font-size:11px">${[15,18.5,25,30,35,40].map(x=>`<span style="position:absolute;left:${z(x)}%;transform:translateX(${x===15?0:x===40?-100:-50}%)">${x}</span>`).join('')}</div>
 <p style="margin:10px 0 0"><b style="color:${c[1]}">${c[0]}</b> <span class="muted">· ${c[2]}</span></p></div>`}
function updBmi(){const el=$('#bmiw'),i=$('#obn');if(!el||!i||!OB.d.height)return;const w=+i.value;if(w>0)el.innerHTML=bmiMeter(w/Math.pow(OB.d.height/100,2))}
function nb(d){const s=OBSTEPS[OB.step],i=$('#obn');i.value=+(Math.min(s.n[3],Math.max(s.n[2],(+i.value||s.n[0])+d*s.n[4]))).toFixed(1);updBmi();vib(8)}
function obNum(){const s=OBSTEPS[OB.step],v=+$('#obn').value;if(!v||v<s.n[2]||v>s.n[3])return toast(`Enter ${s.n[2]}–${s.n[3]} ${s.n[1]}`);OB.d[s.k]=v;OB.step++;render('push')}
function finishOB(){if(!OB.active)return;const first=!S.profile;const d=OB.d;S.profile={...S.profile,...d};(Array.isArray(d.focus)?d.focus:[]).forEach(id=>{if(!(id in S.quests))S.quests[id]=0});delete S.profile.focus;S.goals=S.goals||{};
 if(d.dreamWeight&&(!S.goals.weight||S.goals.weight.done)&&Math.abs(d.dreamWeight-d.weight)>=.1)S.goals.weight={target:d.dreamWeight,start:d.weight,down:d.dreamWeight<d.weight,set:Date.now(),done:null};
 const _bf=bodyFat()?.bf;if(d.dreamBF&&_bf&&(!S.goals.bf||S.goals.bf.done)&&Math.abs(d.dreamBF-_bf)>=.1)S.goals.bf={target:d.dreamBF,start:+_bf.toFixed(1),down:d.dreamBF<_bf,set:Date.now(),done:null};
 delete S.profile.dreamWeight;delete S.profile.dreamBF;
 if(first)S.weights.push([Date.now(),d.weight]);OB.active=false;save();stack=[];tab='plan';if(first)push('result');else{render('fade');toast('Plan updated ✅')}}
V.result=()=>{const t=targets(),b=bodyFat(),p=S.profile;setTimeout(()=>confetti(40),400);
 return`<div class="top"><h1>Your plan is ready 🎉</h1></div>
 <div class="card stagger" style="text-align:center"><p class="muted">Daily calorie target</p><div class="big" style="font-size:52px;color:var(--acc)" data-count="${t.kcal}">0</div><p class="muted">kcal / day</p></div>
 <div class="grid2 stagger"><div class="stat"><small>Maintenance</small><b data-count="${t.tdee}">0</b></div><div class="stat"><small>${t.adj<0?'Daily deficit':t.adj>0?'Daily surplus':'Balance'}</small><b>${Math.abs(t.adj)}</b></div>
 <div class="stat"><small>Protein</small><b>${t.protein} g</b></div><div class="stat"><small>Body fat</small><b data-count="${b.bf.toFixed(1)}" data-dec="1">0</b></div>
 <div class="stat"><small>Water</small><b>${(t.water/1000).toFixed(1)} L</b></div><div class="stat"><small>Steps</small><b>${t.steps.toLocaleString()}</b></div></div>
 <div style="margin-top:14px">${bmiMeter(b.bmi)}</div>
 <div class="card" style="margin-top:14px"><b>Expected:</b> <span class="muted">${t.adj?`${(Math.abs(t.adj)*7/7700).toFixed(2)} kg ${t.adj<0?'lost':'gained'} per week`:'Maintain weight while getting stronger'}</span></div>
 <div class="sticky"><button class="btn" onclick="go('plan')">Let's go 🚀</button></div>`};

// ================= PLAN (daily checklist) =================
function shiftDay(n){const d=new Date(viewDate+'T12:00');d.setDate(d.getDate()+n);if(iso(d)>today())return;viewDate=iso(d);render('fade')}
function row({done,e,bg,t,s,p,on,right}){return`<div class="row" onclick="${on}"><div class="check ${done?'on':''}"></div><div class="tile" style="background:${bg}">${e}</div><div class="rbody"><b>${t}</b><small>${s}</small>${p!=null?`<div class="prog"><i style="width:${Math.min(100,p*100)}%"></i></div>`:''}</div>${right||'<span class="chev">›</span>'}</div>`}
V.plan=()=>{const t=targets(),d=viewDate,isT=d===today(),f=dayFood(d),k=sum(f,1),L=level();
 const wk=S.workouts.filter(w=>iso(w.ts)===d),pk=todaysProg(),P=PROGS[pk];
 const water=S.water[d]||0,steps=(S.steps[d]||0),qs=questList().filter(q=>q.i<q.steps.length);
 const wIn=S.weights.some(w=>iso(w[0])===d);const dd=new Date(d+'T12:00');
 return`<p class="muted" style="padding-top:18px;margin-bottom:-14px">Hi, ${esc(S.profile.name||'champ')} 👋</p><div class="top"><h1>My Plan</h1><div class="flex" style="flex:none"><span class="chip">⚡ ${streak()}</span><span class="chip" onclick="push('levelinfo')">Lv ${L.lvl}</span></div></div>
 <div class="datenav"><button class="iconbtn" onclick="shiftDay(-1)">‹</button><div><b>${isT?'Today':dd.toLocaleDateString(undefined,{weekday:'long'})}</b><small>${dd.toLocaleDateString(undefined,{weekday:'long',month:'short',day:'numeric'})}</small></div><button class="iconbtn" style="opacity:${isT?.3:1}" onclick="shiftDay(1)">›</button></div>
 <div class="list stagger">
 ${row({done:k>=t.kcal*.85,e:'🥗',bg:'#dcfce7',t:'Add Food',s:`${k.toLocaleString()} of ${t.kcal.toLocaleString()} cal`,p:k/t.kcal,on:"go('meals')"})}
 ${row({done:wk.length>0,e:P.e,bg:P.bg,t:wk.length?'Workout done 💪':'Do Your Workout',s:wk.length?`+${wk.reduce((s,w)=>s+w.xp,0)} XP earned`:`${P.name} · ~45 mins`,on:wk.length?"go('workouts')":`push('prog','${pk}')`})}
 ${qs.map(q=>row({done:false,e:q.icon,bg:'#fef3c7',t:'Quest Checkpoint',s:`${stepLbl(q.steps[q.i])} · ${q.i}/${q.steps.length}`,p:q.i/q.steps.length,on:`push('quest','${q.id}')`})).join('')}
 ${row({done:water>=t.water,e:'💧',bg:'#e0f2fe',t:'Water Tracker',s:`${water.toLocaleString()} of ${t.water.toLocaleString()} ml`,p:water/t.water,on:'addWater(250)',right:`<button class="btn sm" onclick="event.stopPropagation();addWater(250)">+250</button>`})}
 ${row({done:steps>=t.steps,e:'👟',bg:'#fce7f3',t:'Walk',s:`${steps.toLocaleString()} of ${t.steps.toLocaleString()} steps`,p:steps/t.steps,on:"go('run')"})}
 ${row({done:wIn,e:'⚖️',bg:'#ede9fe',t:'Weigh-in',s:wIn?`${S.weights.filter(w=>iso(w[0])===d).at(-1)[1]} kg logged`:'Track your progress',on:'weighIn()'})}
 </div>
 ${isT?fastCard():''}
 <div class="card" style="margin-top:14px;background:linear-gradient(135deg,#fff0f3,#fff7ed)"><b>💬 ${CHEERS[dayIdx()%CHEERS.length]}</b></div>
 ${sciCard(SCIENCE[dayIdx()%SCIENCE.length],'🔬 Science tip of the day')}
 <div class="sec">💡 Tips for you</div>${tips().slice(0,3).map(x=>`<div class="tip">${x}</div>`).join('')}`};
function sciCard([e,t,txt,src],head){return`<div class="card"><small class="muted" style="font-weight:800">${head||''}</small><div class="flex" style="align-items:flex-start;margin-top:6px"><span style="font-size:30px;flex:none">${e}</span><div><b>${t}</b><p style="font-size:14px;margin:4px 0;line-height:1.45">${txt}</p><small class="muted">📚 ${src}</small></div></div></div>`}
V.science=()=>`<div class="top">${backBtn()}<h1>Science library</h1><span></span></div><p class="muted" style="margin-bottom:12px">Evidence-based tips from peer-reviewed research.</p><div class="stagger">${SCIENCE.map(s=>sciCard(s)).join('')}</div>`;
function addWater(ml){S.water[viewDate]=(S.water[viewDate]||0)+ml;save();render();xpFly('💧 +'+ml)}
function weighIn(){openSheet(`<h3 style="font-size:20px">Weigh-in ⚖️</h3><p class="muted">Morning, after the bathroom, before eating.</p><input id="wi" type="number" step="0.1" inputmode="decimal" value="${S.profile.weight}"><button class="btn" style="margin-top:10px" onclick="saveWeight()">Save</button>`)}
function saveWeight(){const v=+$('#wi').value;if(!v)return;const prev=S.profile.weight;S.weights.push([new Date(viewDate+'T'+new Date().toTimeString().slice(0,8)).getTime(),v]);S.weights.sort((a,b)=>a[0]-b[0]);if(viewDate===today())S.profile.weight=v;save();closeSheet();render();
 toast(v<prev?`📉 ${(prev-v).toFixed(1)} kg down! Great job!`:v>prev?`📈 +${(v-prev).toFixed(1)} kg`:'Weight saved ✅')}
function tips(){const t=targets(),f=dayFood(today()),k=sum(f,1),p=sum(f,2),out=[];
 const neg=MUSCLES.filter(m=>{const d=daysSince(m);return d===null||d>=5});if(neg.length&&S.workouts.length)out.push(`Not trained in 5+ days: <b>${neg.slice(0,4).join(', ')}</b>`);
 if(p<t.protein*.5&&new Date().getHours()>=14)out.push(`Behind on protein (${p}/${t.protein}g) — add chicken, tuna, eggs or a whey shake.`);
 if(k>t.kcal)out.push(`${k-t.kcal} kcal over target. A 30–45 min walk burns ~150–250 kcal 👟`);
 out.push('Progressive overload = more XP. Beat your <b>all-time best</b> for a 2× PR bonus 🏅; beat <b>last session</b> for a smaller 📈 overload bonus.');
 const low=MUSCLES.reduce((a,m)=>S.xp[m]<S.xp[a]?m:a);out.push(`Weakest rank: <b>${low}</b> (${rankOf(S.xp[low]).name}). Give it extra sets!`);
 if(S.profile.goal.includes('cut'))out.push('On a cut, keep lifting heavy to hold muscle and hit your step goal.');return out}
V.levelinfo=()=>{const L=level();return`<div class="top">${backBtn()}<h1>Level ${L.lvl}</h1><span></span></div>
 <div class="card"><div class="big" data-count="${L.total}">0</div><p class="muted">total XP</p><div class="prog" style="height:10px"><i style="width:${L.cur/L.need*100}%"></i></div><p class="muted" style="margin-top:6px">${L.cur} / ${L.need} XP to level ${L.lvl+1}</p></div>
 <div class="card"><h3>How to earn XP</h3><div class="tip">🏋️ Every set: 10 + volume/10 XP</div><div class="tip">🏅 New PR (heavier or more reps): <b>2× XP + 25</b></div><div class="tip">⚔️ Quest checkpoints: 100–650 bonus XP</div><div class="tip">💪 Main muscles get full XP, helper muscles get half</div></div>`};

V.workouts=()=>{const pk=todaysProg(),r=(k,feat)=>{const P=PROGS[k];return`<div class="row ${feat?'feat':''}" onclick="push('prog','${k}')"><div class="tile" style="background:${P.bg}">${P.e}</div><div class="rbody"><b>${P.name}</b><small>${P.ex.length?P.ex.length+' exercises · '+P.sub:P.sub}</small></div><span class="chev">›</span></div>`};
 return`<div class="top"><h1>Workouts</h1>${S.active?`<button class="btn sm" onclick="push('player')">Resume ▶</button>`:''}</div>
 <div class="row" onclick="push('splits')" style="margin-bottom:10px"><span style="font-size:22px">🗓️</span><div class="rbody"><b>${SPLITS[S.split].name}</b><small>Workout style · tap to change</small></div><span class="chev">›</span></div>
 <p class="muted" style="margin-bottom:6px">Recommended today</p>${r(pk,true)}
 <div class="list stagger">${[...new Set([...SPLITS[S.split].days,'home','free'])].filter(k=>k!==pk).map(k=>r(k)).join('')}</div>
 <div class="sec">History</div><div class="list">${S.workouts.slice(-8).reverse().map(w=>`<div class="row" style="cursor:default"><div class="tile" style="background:#f3f3f7;font-size:22px;width:44px;height:44px">${(PROGS[w.prog]||PROGS.free).e}</div><div class="rbody"><b>${(PROGS[w.prog]||PROGS.free).name}</b><small>${new Date(w.ts).toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'})} · ${w.sets.length} sets${w.prs?` · ${w.prs} PR 🏅`:''}</small></div><span class="badge" style="background:#fff0f3;color:var(--acc)">+${w.xp}</span></div>`).join('')||'<div class="row muted" style="cursor:default">No workouts yet — start one above!</div>'}</div>`};
V.prog=k=>{const P=PROGS[k];
 return`<div class="top">${backBtn()}<span></span><span></span></div>
 <div class="card" style="background:${P.bg};text-align:center;box-shadow:none"><div style="font-size:70px;animation:bounce .5s">${P.e}</div><h1 style="font-size:26px">${P.name}</h1><p class="muted">${P.sub}</p></div>
 ${P.ex.length?`<div class="list stagger">${P.ex.map((e,i)=>{const s=sugg(e),b=bestSet(e);return`<div class="row" style="cursor:default"><div class="tile" style="background:${PASTEL[i%8]};width:48px;height:48px;font-size:24px">${EX[e][2]}</div><div class="rbody"><b>${escT(e)}</b><small>${b?`Best ${b.w}kg × ${b.r} · Target ${s.w}kg × ${s.r}`:'3–4 sets · 8–12 reps'}</small></div></div>`}).join('')}</div>`:'<p class="muted" style="text-align:center">Add any exercise once you start.</p>'}
 <div class="sticky"><button class="btn" onclick="startW('${k}')">${S.active?'Restart with this workout':'Start Workout'}</button></div>`};
function startW(k){if(S.active&&S.active.sets.length&&!confirm('Discard current workout?'))return;const P=PROGS[k];S.active={ts:Date.now(),prog:k,list:P.ex.length?P.ex.map(e=>S.subs[e]&&EX[S.subs[e]]?S.subs[e]:e):['Push-up'],idx:0,sets:[],xp:0,prs:0,ups:[],qs:[]};save();stack=[];push('player')}
V.player=()=>{const a=S.active;if(!a)return V.workouts();const ex=a.list[a.idx],s=sugg(ex),mine=a.sets.filter(x=>x.ex===ex);
 const last=mine.at(-1),w=last?last.w:s.w,r=last?last.r:s.r;
 const qh=questList().filter(q=>q.i<q.steps.length&&q.steps[q.i][0]===ex);
 return`<div class="top"><button class="iconbtn" onclick="stack=[];go('workouts')">✕</button><span class="chip">⚡ +${a.xp} XP</span><button class="btn sm" onclick="finishW()">Finish</button></div>
 <div class="segs">${a.list.map((_,i)=>`<i class="${i<=a.idx?'on':''}"></i>`).join('')}</div>
 <div class="player-ex"><div class="tile" style="background:${PASTEL[a.idx%8]}">${EX[ex][2]}</div><p class="muted">Exercise ${a.idx+1} of ${a.list.length}</p><h1 style="font-size:24px">${escT(ex)}</h1><p class="muted">${EX[ex][0].join(', ')}</p><div class="flex" style="justify-content:center;gap:6px;margin-top:8px;flex-wrap:wrap"><button class="btn sm sec2" onclick="formSheet(S.active.list[S.active.idx])">📐 Form</button><button class="btn sm sec2" onclick="cantDo()">😓 Can't do it</button><button class="btn sm sec2" onclick="altSheet(S.active.list[S.active.idx])">🔁 Alternatives</button></div></div>
 <div class="tip">${s.text}</div>${qh.map(q=>`<div class="tip" style="background:#fef3c7">⚔️ Hit <b>${stepLbl(q.steps[q.i])}</b> to clear a checkpoint in ${esc(q.name)}</div>`).join('')}
 <div class="grid2" style="margin:12px 0"><div><div class="lbl">Weight (kg)</div><div class="stepper"><button onclick="stp('pw',-2.5)">−</button><input id="pw" type="number" inputmode="decimal" value="${w}"><button onclick="stp('pw',2.5)">+</button></div></div>
 <div><div class="lbl">Reps</div><div class="stepper"><button onclick="stp('pr',-1)">−</button><input id="pr" type="number" inputmode="numeric" value="${r}"><button onclick="stp('pr',1)">+</button></div></div></div>
 <button class="btn" onclick="addSet()">✓ Log Set ${mine.length+1}</button>
 <div class="card" style="margin-top:14px">${mine.map((x,i)=>`<div class="setrow"><span>Set ${i+1}: ${x.w}kg × ${x.r} ${x.pr?'🏅':x.ov?'📈':''}</span><span style="color:var(--acc)">+${x.xp} XP</span></div>`).join('')||'<p class="muted">No sets yet. 3–4 sets is the sweet spot.</p>'}</div>
 <div class="flex" style="margin-top:6px"><button class="btn sec2" style="opacity:${a.idx?1:.4}" onclick="mv(-1)">‹ Prev</button>${a.idx<a.list.length-1?`<button class="btn" onclick="mv(1)">Next ›</button>`:`<button class="btn sec2" onclick="pickEx()">+ Exercise</button>`}</div>
 ${a.idx<a.list.length-1?`<button class="btn sec2" style="margin-top:10px" onclick="pickEx()">+ Add exercise</button>`:''}<div style="height:20px"></div>`};
function stp(id,d){const i=$('#'+id);i.value=Math.max(0,+(+i.value+d).toFixed(1));vib(8)}
function mv(d){const a=S.active;a.idx=Math.max(0,Math.min(a.list.length-1,a.idx+d));save();render(d>0?'push':'pop')}
function pickEx(swap){window._swap=!!swap;openSheet(`<h3 style="font-size:20px">${swap?'Swap exercise':'Add exercise'}</h3><input placeholder="🔍 Search" oninput="document.querySelectorAll('.exrow').forEach(r=>r.style.display=r.dataset.n.includes(this.value.toLowerCase())?'':'none')">
 <div class="row" onclick="newExSheet()"><div class="tile" style="background:#fce7f3;width:44px;height:44px;font-size:22px">➕</div><div class="rbody"><b>Create custom exercise</b><small>e.g. Incline Bench Press, Cable Crossover…</small></div></div>

function stepDetect(e){const g=e.accelerationIncludingGravity;if(!g)return;const m=Math.sqrt(g.x*g.x+g.y*g.y+g.z*g.z);pedo.avg=pedo.avg*.9+m*.1;const t=Date.now();
 if(!pedo.peak&&m>pedo.avg+2.2&&t-pedo.last>280){pedo.peak=true;pedo.last=t;S.steps[today()]=(S.steps[today()]||0)+1;if(RUN)RUN.steps++;
  if(S.steps[today()]%20===0){save();const el=$('#stepnow');if(el)el.textContent=S.steps[today()].toLocaleString()}}
 else if(pedo.peak&&m<pedo.avg)pedo.peak=false}
async function startPedo(){if(pedo.on)return;try{if(typeof DeviceMotionEvent!=='undefined'&&DeviceMotionEvent.requestPermission)await DeviceMotionEvent.requestPermission()}catch(e){}

function stopPedo(){window.removeEventListener('devicemotion',stepDetect);pedo.on=false;S.pedoOn=false;save();render()}
function hav(a,b){const R=6371e3,r=x=>x*Math.PI/180,dl=r(b[0]-a[0]),dn=r(b[1]-a[1]),h=Math.sin(dl/2)**2+Math.cos(r(a[0]))*Math.cos(r(b[0]))*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
const fmtT=s=>{s=Math.floor(s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return(h?h+':':'')+String(m).padStart(h?2:1,'0')+':'+String(x).padStart(2,'0')};

function routeSVG(pts,live){if(pts.length<2)return`<div style="display:grid;place-items:center;height:100%;color:var(--muted);font-weight:700">${live?'📡 Waiting for GPS… go outside for a better signal':'No route'}</div>`;
 const la=pts.map(p=>p[0]),lo=pts.map(p=>p[1]),mnA=Math.min(...la),mxA=Math.max(...la),mnO=Math.min(...lo),mxO=Math.max(...lo),k=Math.cos(mnA*Math.PI/180);
 const sp=Math.max((mxA-mnA),(mxO-mnO)*k,1e-5),W=320,H=240,pad=24,X=o=>pad+((o-mnO)*k/sp)*(W-pad*2)+((W-pad*2)-((mxO-mnO)*k/sp)*(W-pad*2))/2,Y=a=>H-pad-((a-mnA)/sp)*(H-pad*2)-((H-pad*2)-((mxA-mnA)/sp)*(H-pad*2))/2;
 const d=pts.map(p=>`${X(p[1]).toFixed(1)},${Y(p[0]).toFixed(1)}`).join(' ');const e=pts.at(-1),s=pts[0];
 return`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:100%"><defs><pattern id="g" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#dfe5ee"/></pattern></defs><rect width="100%" height="100%" fill="url(#g)"/><polyline points="${d}" fill="none" stroke="#e3262f" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="${X(s[1])}" cy="${Y(s[0])}" r="7" fill="#22c55e" stroke="#fff" stroke-width="3"/><circle cx="${X(e[1])}" cy="${Y(e[0])}" r="8" fill="#e3262f" stroke="#fff" stroke-width="3">${live?'<animate attributeName="r" values="7;11;7" dur="1.4s" repeatCount="indefinite"/>':''}</circle></svg>`}
V.run=()=>{const t=targets(),st=S.steps[today()]||0,km=st*0.00076,kc=Math.round(km*0.6*S.profile.weight);

function addCustom(){const ex=$('#cqe').value,start=+$('#cqs').value||0,target=+$('#cqt').value;if(!target||target<=start)return toast('Goal must be above your current max');S.custom.push({ex,start,target,i:0});save();closeSheet();render()}
V.quest=id=>{const q=questList().find(x=>x.id===id);if(!q)return V.challenges();const done=q.i>=q.steps.length;
 return`<div class="top">${backBtn()}<span class="chip">${q.i}/${q.steps.length}</span></div>
 <div style="text-align:center;margin-bottom:18px"><div style="font-size:64px;animation:bounce .5s">${q.icon}</div><h1 style="font-size:24px">${escT(q.name)}</h1><div class="prog" style="height:8px;margin:10px 30px"><i style="width:${q.i/q.steps.length*100}%"></i></div></div>
 <div class="card stagger">${q.steps.map((st,k)=>{const t=st[2];return`<div class="node ${k<q.i?'done':k===q.i?'cur':''}"><div class="dot">${k<q.i?'✓':k===q.i?'⚔️':'🔒'}</div><div style="flex:1;opacity:${k>q.i?.5:1}"><b>${escT(stepLbl(st))}</b>${k===q.i?`<p class="muted" style="margin:4px 0 8px">${t}</p><button class="btn sm" onclick="testCP('${q.id}')">I did it — test</button>`:''}${k<q.i?'<br><small class="muted">Cleared</small>':''}</div></div>`}).join('')}</div>
 ${done?'<div class="card" style="text-align:center"><div class="big">🏆</div><b>Quest complete — legend!</b><p class="muted">Ready for more? Raise the goal 👇</p></div>':''}
 <button class="btn" style="margin-bottom:10px" onclick="raiseSheet('${id}')">🎯 ${done?'Raise the goal':'Change / raise the goal'}</button>
 <button class="btn sec2" onclick="if(confirm('Abandon this challenge?')){${id[0]==='c'?`S.custom.splice(${id.slice(1)},1)`:`delete S.quests['${id}']`};delete S.ext['${id}'];save();back()}">Abandon</button><div style="height:20px"></div>`};
function raiseSheet(id){const q=questList().find(x=>x.id===id),last=q.steps.at(-1),[e,n,,bw]=last;
 openSheet(`<h3 style="font-size:20px">🎯 Raise the goal</h3><p class="muted">Current final goal: <b>${escT(stepLbl(last))}</b>. Set a new one and we'll add checkpoints to get there.</p>
 <select id="rge">${[...new Set([e,...Object.keys(EX)])].map(x=>`<option ${x===e?'selected':''}>${escT(x)}</option>`).join('')}</select>
 <div class="flex"><div><div class="lbl">New target ${isSec(e)?'(sec)':isKm(e)?'(km)':'(reps)'}</div><input id="rgn" type="number" value="${n*2}"></div>${bw?`<div><div class="lbl">× bodyweight</div><input id="rgb" type="number" step="0.05" value="${bw}"></div>`:''}</div>
 <button class="btn" style="margin-top:10px" onclick="raiseGoal('${id}')">Add checkpoints</button>`)}
function raiseGoal(id){const q=questList().find(x=>x.id===id),last=q.steps.at(-1),ne=$('#rge').value,nn=+$('#rgn').value,nb=$('#rgb')?+$('#rgb').value:0;if(!nn)return toast('Enter a target');
 const same=ne===last[0],start=same?last[1]:0,sbw=last[3]||0;if(same&&nn<=start&&(!nb||nb<=sbw))return toast('New goal must be higher');
 const steps=[];for(let i=1;i<=3;i++){const f=i/3;let r=same&&nn>start?start+(nn-start)*f:nn*f;r=isKm(ne)?+r.toFixed(1):Math.max(1,Math.round(r));const b=nb?+(sbw+(nb-sbw)*f).toFixed(2):0;steps.push([ne,r,i===3?`New final goal: ${stepLbl([ne,nn,'',nb])} 🏆`:'Keep progressing: beat your last set by +1 rep each session.',b||undefined])}
 const uniq=steps.filter((s,i)=>i===steps.length-1||stepLbl(s)!==stepLbl(steps[i+1]));(S.ext[id]??=[]).push(...uniq);save();closeSheet();render();confetti(30);toast('🎯 New checkpoints unlocked!')}
function testCP(id){const q=questList().find(x=>x.id===id),[e,n]=q.steps[q.i];openSheet(`<h3 style="font-size:20px">Checkpoint test</h3><p class="muted">Your best single set of <b>${escT(e)}</b>? Goal: <b>${escT(stepLbl(q.steps[q.i]))}</b></p><input id="tc" type="number" inputmode="decimal" placeholder="${isSec(e)?'Seconds':isKm(e)?'Kilometers':'Reps'}">${q.steps[q.i][3]?`<input id="tcw" type="number" step="0.5" placeholder="Weight used (kg) — need ${bwKg(q.steps[q.i][3])}">`:''}<button class="btn" style="margin-top:10px" onclick="doTest('${id}')">Submit</button>`)}
function doTest(id){const q=questList().find(x=>x.id===id),[e,n]=q.steps[q.i],r=parseFloat($('#tc').value);if(!r)return;const w=+($('#tcw')?.value||0);closeSheet();const m=checkQuests(e,r,w);save();render();toast(m.length?m.join('<br>'):`${r}/${n} — so close! Keep training 💪`)}

// ================= MORE =================
function chart(vals,labels,{type='bar',color='#e3262f',emoji=''}={}){if(!vals.length||vals.every(v=>!v))return'<p class="muted" style="text-align:center;padding:20px 0">Not enough data yet — keep going! 🌱</p>';
 const W=320,H=150,P=20,mx=Math.max(...vals.map(Math.abs),1),mn=type==='line'?Math.min(...vals,0):0,n=vals.length,bw=(W-P*2)/n,y=v=>H-P-((v-mn)/(mx-mn||1))*(H-P*2);let s=`<svg viewBox="0 0 ${W} ${H}" style="width:100%">`;
 if(type==='bar')vals.forEach((v,i)=>{const hh=Math.max(3,(Math.abs(v)/mx)*(H-P*2));s+=`<rect x="${P+i*bw+4}" y="${H-P-hh}" width="${bw-8}" height="${hh}" rx="7" fill="${color}" opacity="${i===n-1?1:.55}"><animate attributeName="height" from="0" to="${hh}" dur=".7s"/><animate attributeName="y" from="${H-P}" to="${H-P-hh}" dur=".7s"/></rect>`;if(v)s+=`<text x="${P+i*bw+bw/2}" y="${H-P-hh-5}" fill="#555" font-size="10" font-weight="700" text-anchor="middle">${v>=1000?(v/1000).toFixed(1)+'k':Math.round(v)}</text>`});
 else{const pts=vals.map((v,i)=>`${P+i*bw+bw/2},${y(v)}`);s+=`<polygon points="${P+bw/2},${H-P} ${pts.join(' ')} ${P+(n-1)*bw+bw/2},${H-P}" fill="${color}" opacity=".12"/><polyline points="${pts.join(' ')}" fill="none" stroke="${color}" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="2000" stroke-dashoffset="2000"><animate attributeName="stroke-dashoffset" to="0" dur="1.4s" fill="freeze"/></polyline>`;
  const l=n-1;s+=`<circle cx="${P+l*bw+bw/2}" cy="${y(vals[l])}" r="5" fill="${color}"/><text x="${P+l*bw+bw/2}" y="${y(vals[l])-10}" font-size="18" text-anchor="middle">${emoji}</text>`}
 labels.forEach((lb,i)=>{if(n<=8||i%Math.ceil(n/8)===0)s+=`<text x="${P+i*bw+bw/2}" y="${H-4}" fill="#9a9aab" font-size="9" text-anchor="middle">${lb}</text>`});return s+'</svg>'}
function weeklyXP(){const v=[],l=[];for(let i=7;i>=0;i--){const end=Date.now()-i*7*864e5,st=end-7*864e5;v.push(S.workouts.filter(w=>w.ts>st&&w.ts<=end).reduce((s,w)=>s+w.xp,0));l.push(i?`-${i}w`:'now')}return[v,l]}
function liftSeries(ex){const v=[],l=[];S.workouts.forEach(w=>{const ss=w.sets.filter(s=>s.ex===ex);if(ss.length){v.push(Math.max(...ss.map(s=>e1rm(s.w,s.r))));l.push(new Date(w.ts).getDate()+'/'+(new Date(w.ts).getMonth()+1))}});return[v.slice(-12),l.slice(-12)]}
let chartEx=null;
V.more=()=>{const p=S.profile,t=targets();
 return`<div class="top"><h1>More</h1><button class="iconbtn" onclick="push('settings')">⚙️</button></div>
 <div class="card flex"><div class="tile" style="background:#fdeced;flex:none">${p.sex==='m'?'🧔':'👩'}</div><div><b style="font-size:18px">Level ${level().lvl} athlete</b><p class="muted">${p.weight} kg · ${p.height} cm · ${({cut:'Losing fat',slowcut:'Slow cut',maintain:'Toning',bulk:'Building muscle'})[p.goal]}</p></div></div>
 <div class="sec">📊 Plan</div><div class="list"><div class="row" style="cursor:default"><div class="rbody"><b>Calorie target</b></div><b>${t.kcal} kcal</b></div><div class="row" style="cursor:default"><div class="rbody"><b>Maintenance (TDEE)</b></div><b>${t.tdee}</b></div><div class="row" onclick="deficitSheet()"><div class="rbody"><b>${t.adj<0?'Daily deficit':'Daily surplus'}</b><small>Tap to adjust</small></div><b>${Math.abs(t.adj)}</b><span class="chev">›</span></div><div class="row" style="cursor:default"><div class="rbody"><b>Protein</b></div><b>${t.protein} g</b></div></div>
 <div class="sec">Explore</div><div class="list"><div class="row" onclick="push('learn')"><span style="font-size:22px">📚</span><div class="rbody"><b>Learn</b><small>Articles, hypertrophy, muscle parts</small></div><span class="chev">›</span></div><div class="row" onclick="push('settings')"><span style="font-size:22px">⚙️</span><div class="rbody"><b>Settings</b><small>Plan, reminders, backup</small></div><span class="chev">›</span></div></div>`};
function strengthCard(){const done=Object.keys(EX).filter(e=>bestSet(e));chartEx=done.includes(chartEx)?chartEx:done[0];const [lv,ll]=chartEx?liftSeries(chartEx):[[],[]];const gain=lv.length>1?Math.round((lv.at(-1)/lv[0]-1)*100):0;
 return`<div class="sec">📈 Strength</div><div class="card">${done.length?`<select onchange="chartEx=this.value;render()">${done.map(e=>`<option ${e===chartEx?'selected':''}>${escT(e)}</option>`).join('')}</select>${chart(lv,ll,{type:'line',color:'#22c55e',emoji:'💪'})}<p class="muted">Estimated 1-rep max${gain>0?` · <b style="color:var(--good)">+${gain}% stronger!</b> 🚀`:''}</p>`:'<p class="muted">Log a workout to see your strength curve 🌱</p>'}</div>`}
V.settings=()=>{const p=S.profile;return`<div class="top">${backBtn()}<h1>Settings</h1><span></span></div>
 <p class="muted" style="text-align:center;font-style:italic;margin:6px 0 14px"><span style="display:block;margin:0 auto 6px;background:#15151f;border-radius:16px;padding:10px;width:max-content"><img src="logo.png" alt="RepWise" style="width:90px;display:block"></span>“Be Wise in Every Rep”</p>
 <div class="list"><div class="row" onclick="startOB()"><span style="font-size:22px">👤</span><div class="rbody"><b>Redo my plan</b><small>Goal, body, dream weight & body fat, deficit, fasting</small></div><span class="chev">›</span></div>
 <div class="row" onclick="measSheet()"><span style="font-size:22px">📏</span><div class="rbody"><b>Body measurements</b><small>Waist, neck, hip → accurate body fat</small></div><span class="chev">›</span></div>
 <div class="row" onclick="S.apiKey=prompt('Anthropic API key',S.apiKey||'')||null;save();toast('Saved')"><span style="font-size:22px">🤖</span><div class="rbody"><b>AI photo key</b><small>${S.apiKey?'Set ✓':'Not set'}</small></div><span class="chev">›</span></div>
 <div class="row" onclick="push('splits')"><span style="font-size:22px">🗓️</span><div class="rbody"><b>Workout style</b><small>${SPLITS[S.split].name}</small></div><span class="chev">›</span></div>
 <div class="row" onclick="push('fasting')"><span style="font-size:22px">⏳</span><div class="rbody"><b>Intermittent fasting</b><small>${S.fast.on?S.fast.proto+' on':'Off'}</small></div><span class="chev">›</span></div>
 <div class="row" onclick="push('science')"><span style="font-size:22px">🔬</span><div class="rbody"><b>Science library</b><small>${SCIENCE.length} research-backed tips</small></div><span class="chev">›</span></div>
 <div class="row" onclick="push('transfer')"><span style="font-size:22px">🔄</span><div class="rbody"><b>Transfer / backup account</b><small>Move your progress to another device</small></div><span class="chev">›</span></div>
 <div class="row" onclick="push('privacy')"><span style="font-size:22px">🔒</span><div class="rbody"><b>Privacy</b><small>What we store (almost nothing)</small></div><span class="chev">›</span></div>
 <div class="row" onclick="if(confirm('Delete ALL data?')){localStorage.removeItem('gq');location.reload()}"><span style="font-size:22px">🗑️</span><div class="rbody"><b style="color:var(--acc)">Reset everything</b></div></div></div>`};
// ================= DREAM GOALS =================
// A goal is locked once set: it can only be changed after it has been reached.
const GOALDEF={weight:{label:'Dream weight',unit:'kg',min:30,max:250,step:.5,cur:()=>S.profile.weight},bf:{label:'Dream body fat',unit:'%',min:3,max:60,step:.5,cur:()=>bodyFat().bf}};
function goalReached(g,cur){return g.down?cur<=g.target:cur>=g.target}
function checkGoals(){if(!S.profile||!S.goals)return;for(const k in S.goals){const g=S.goals[k];if(g.done)continue;const cur=GOALDEF[k].cur();
 if(goalReached(g,cur)){g.done=Date.now();setTimeout(()=>{confetti(60);toast(`🏆 ${GOALDEF[k].label} reached! You can set a new one now.`)},300)}}}
function goalCard(){const G=S.goals||{};return`<div class="card"><h3 style="margin-top:0">🎯 Dream goals</h3>${Object.keys(GOALDEF).map(k=>{const d=GOALDEF[k],g=G[k],cur=d.cur();
 if(!g)return`<div class="row" onclick="goalSheet('${k}')"><div class="rbody"><b>${d.label}</b><small>Not set — now ${cur.toFixed(1)} ${d.unit}</small></div><span class="chip">➕ Set</span></div>`;
 const pct=Math.max(0,Math.min(1,(cur-g.start)/((g.target-g.start)||1)));const days=Math.round(((g.done||Date.now())-g.set)/864e5);
 return`<div class="row" ${g.done?`onclick="goalSheet('${k}')"`:''}><div class="rbody"><b>${d.label}: ${g.target} ${d.unit}</b><small>${g.done?`✅ Reached in ${days} day${days===1?'':'s'} — tap to set a new goal`:`🔒 Locked until reached · now ${cur.toFixed(1)} ${d.unit} · ${Math.abs(cur-g.target).toFixed(1)} ${d.unit} to go`}</small><div class="prog"><i style="width:${(g.done?1:pct)*100}%"></i></div></div>${g.done?'<span class="chip">✏️ Edit</span>':''}</div>`}).join('')}</div>`}
function goalSheet(k){const d=GOALDEF[k],g=(S.goals||{})[k];if(g&&!g.done)return toast('🔒 Reach your current goal first');const cur=d.cur();
 openSheet(`<h3 style="font-size:20px">${d.label}</h3><p class="muted">You're at ${cur.toFixed(1)} ${d.unit} now. Once saved, this goal stays locked until you reach it.</p><input id="gv" type="number" inputmode="decimal" step="${d.step}" value="${g?g.target:''}" placeholder="Target (${d.unit})"><button class="btn" style="margin-top:10px" onclick="saveGoal('${k}')">Save goal</button>`)}
function saveGoal(k){const d=GOALDEF[k],v=+$('#gv').value,cur=d.cur();if(!v||v<d.min||v>d.max)return toast(`Enter ${d.min}–${d.max} ${d.unit}`);
 if(Math.abs(v-cur)<.1)return toast('Pick a target different from where you are now');
 S.goals=S.goals||{};S.goals[k]={target:v,start:+cur.toFixed(1),down:v<cur,set:Date.now(),done:null};save();closeSheet();render();toast('🎯 Goal set — go get it!')}
function measSheet(){const p=S.profile;openSheet(`<h3 style="font-size:20px">Measurements (cm)</h3><p class="muted">Waist at navel, neck below Adam's apple, hip at widest (women).</p><input id="mw" type="number" step="0.1" placeholder="Waist" value="${p.waist||''}"><input id="mn" type="number" step="0.1" placeholder="Neck" value="${p.neck||''}"><input id="mh" type="number" step="0.1" placeholder="Hip (women)" value="${p.hip||''}"><button class="btn" style="margin-top:10px" onclick="S.profile.waist=+$('#mw').value||0;S.profile.neck=+$('#mn').value||0;S.profile.hip=+$('#mh').value||0;S.profile.measTs=Date.now();checkGoals();save();closeSheet();render();toast('Body fat updated 🧬')">Save</button>`)}
// ---- account transfer (no server: file or code) ----
function payload(){const d={...S};delete d.apiKey;delete d.active;return JSON.stringify({app:'gymquest',v:1,exported:Date.now(),data:d})}
async function gz(str,dir){const s=new Blob([str]).stream().pipeThrough(dir?new CompressionStream('gzip'):new DecompressionStream('gzip'));return new Response(s)}
async function makeCode(){const buf=new Uint8Array(await(await gz(payload(),1)).arrayBuffer());let b='';buf.forEach(x=>b+=String.fromCharCode(x));return'GQ1:'+btoa(b)}
async function readCode(code){code=code.trim().replace(/\s/g,'');if(!code.startsWith('GQ1:'))throw new Error('Not a RepWise code');const bin=atob(code.slice(4)),u=Uint8Array.from(bin,c=>c.charCodeAt(0));return(await gz(u,0)).text()}
async function exportFile(){const json=payload(),name=`repwise-${(S.profile.name||'backup').replace(/\W+/g,'_')}-${today()}.json`,P=window.Capacitor?.Plugins;
 try{if(P?.Filesystem&&P?.Share){const r=await P.Filesystem.writeFile({path:name,data:json,directory:'CACHE',encoding:'utf8'});await P.Share.share({title:'RepWise backup',text:'My RepWise progress',url:r.uri,dialogTitle:'Save or send your backup'});return}
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([json],{type:'application/json'}));a.download=name;a.click();toast('Backup saved 💾')}catch(e){if(!/cancel/i.test(e.message))toast('⚠️ '+e.message)}}
async function copyCode(){const c=await makeCode();$('#codebox').value=c;try{await navigator.clipboard.writeText(c);toast('📋 Code copied! Paste it on your other device')}catch(e){$('#codebox').select();toast('Select & copy the code below')}}
function restore(txt){let o;try{o=JSON.parse(txt)}catch(e){return toast('⚠️ That file is not a valid backup')}
 if(o.app!=='gymquest'||!o.data)return toast('⚠️ Not a RepWise backup');
 if(S.profile&&!confirm(`Replace this device's progress with ${o.data.profile?.name||'the'} backup from ${new Date(o.exported).toLocaleDateString()}?`))return;
 const key=S.apiKey;S=o.data;if(key)S.apiKey=key;save();toast('✅ Account restored! Welcome back, '+esc(S.profile?.name||''));setTimeout(()=>location.reload(),1200)}
function importFile(inp){const f=inp.files[0];if(!f)return;f.text().then(restore);inp.value=''}
async function importCode(){try{restore(await readCode($('#codein').value))}catch(e){toast('⚠️ Invalid code')}}
function importSheet(){openSheet(`<h3 style="font-size:20px">Restore account</h3><label class="btn" style="text-align:center">📂 Choose backup file<input type="file" accept=".json,application/json" style="display:none" onchange="closeSheet();importFile(this)"></label><p class="muted" style="text-align:center;margin:10px 0">or paste a transfer code</p><textarea id="codein" rows="3" style="width:100%;border-radius:14px;border:1.5px solid var(--line);padding:12px;font-size:12px" placeholder="GQ1:..."></textarea><button class="btn sec2" style="margin-top:8px" onclick="importCode()">Restore from code</button>`)}
V.transfer=()=>`<div class="top">${backBtn()}<h1>Transfer</h1><span></span></div>
 <div class="card" style="text-align:center"><div style="font-size:56px">🔄</div><b>Your account lives on this phone</b><p class="muted">No sign-up, no server. To use RepWise on another device, export here and import there.</p></div>
 <div class="sec">1. Send from this device</div>
 <button class="btn" onclick="exportFile()">📤 Export backup file</button><p class="muted" style="margin:6px 0 12px">Save to Drive, send via Messenger/email, or keep it as a backup.</p>
 <button class="btn sec2" onclick="copyCode()">📋 Copy transfer code</button><textarea id="codebox" readonly rows="3" style="width:100%;margin-top:8px;border-radius:14px;border:1.5px solid var(--line);padding:12px;font-size:11px" placeholder="Your code appears here"></textarea>
 <div class="sec">2. Receive on the new device</div><button class="btn sec2" onclick="importSheet()">📥 Import file or code</button>
 <p class="muted" style="margin:14px 0 30px">Tip: export a backup every week — if you lose your phone, your progress is safe. Your AI key is never included.</p>`;

 <div class="card"><h3>🔒 What RepWise stores</h3><div class="tip">✅ Your name, body stats, workouts, food log, steps & runs</div><div class="tip">📱 All of it stays <b>only on this device</b> — there is no account server or database</div><div class="tip">🚫 No email, phone number, ads, trackers or analytics</div><div class="tip">📍 GPS routes are saved only on your phone</div><div class="tip">🔄 Moving devices = export & import a file/code that you control</div></div>`;
