# Builds RepWise for Android and iOS on every push to main, then publishes both to the rolling
# "latest" release that the website links to:
#   /releases/latest/download/RepWise.apk           (Android, signed with the RepWise release key)
#   /releases/latest/download/RepWise-unsigned.ipa  (iPhone, sign with your Apple ID via Sideloadly / AltStore)
#   /releases/latest/download/RepWise-simulator.zip (iOS Simulator build)
#
# Android signing needs these repository secrets (Settings -> Secrets and variables -> Actions):
#   RW_KEYSTORE_B64 (base64 of repwise-release.jks), RW_STORE_PASS, RW_KEY_ALIAS, RW_KEY_PASS
name: Build & release
on:
  push:
    branches: [main]
    paths: ['www/**', 'ios/**', 'android/**', 'package.json', 'package-lock.json', 'capacitor.config.json', '.github/workflows/build.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx cap sync android
      - name: Restore the release signing key
        env:
          RW_KEYSTORE_B64: ${{ secrets.RW_KEYSTORE_B64 }}
        run: |
          if [ -z "$RW_KEYSTORE_B64" ]; then
            echo "::error::Missing RW_KEYSTORE_B64 secret. Add the RepWise signing secrets so Android builds can update existing installs."
            exit 1
          fi
          echo "$RW_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/repwise-release.jks"
      - name: Build signed release APK
        working-directory: android
        env:
          RW_KEYSTORE: ${{ runner.temp }}/repwise-release.jks
          RW_STORE_PASS: ${{ secrets.RW_STORE_PASS }}
          RW_KEY_ALIAS: ${{ secrets.RW_KEY_ALIAS }}
          RW_KEY_PASS: ${{ secrets.RW_KEY_PASS }}
          RW_VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -q
          cp app/build/outputs/apk/release/RepWise.apk "$GITHUB_WORKSPACE/RepWise.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: RepWise.apk

  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx cap sync ios
      - name: Build for the iOS Simulator
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/sim CODE_SIGNING_ALLOWED=NO build
          (cd build/sim/Build/Products/Debug-iphonesimulator && zip -qry "$GITHUB_WORKSPACE/RepWise-simulator.zip" App.app)
      - name: Build unsigned device IPA
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build/dev CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          mkdir -p Payload && cp -R build/dev/Build/Products/Release-iphoneos/App.app Payload/
          zip -qry RepWise-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: |
            RepWise-simulator.zip
            RepWise-unsigned.ipa

  # Publishes only when both apps built, so the website never mixes a new iPhone build with an old Android one.
  release:
    needs: [android, ios]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: RepWise (latest build)
          make_latest: true
          body: |
            Latest RepWise build #${{ github.run_number }} from `${{ github.sha }}`.
            - **RepWise.apk** — Android: open on your phone and install (allow installs from your browser when asked). Updates install over the previous version.
            - **RepWise-unsigned.ipa** — iPhone: sign and install with your Apple ID using Sideloadly or AltStore.
            - **RepWise-simulator.zip** — iOS Simulator build for testing on a Mac.
          files: |
            RepWise.apk
            RepWise-unsigned.ipa
            RepWise-simulator.zip
