# Builds the iOS app on a macOS runner (no Mac needed locally).
# Artifacts: a Simulator build (RepWise-simulator.zip) and an unsigned device build (RepWise-unsigned.ipa)
# that can be signed with your own Apple ID (e.g. Sideloadly / AltStore) or re-signed in Xcode.
name: Build & release
on:
  push:
    branches: [main]
    paths: ['www/**', 'ios/**', 'apk/**', 'package.json', 'package-lock.json', 'capacitor.config.json', '.github/workflows/ios.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx cap sync ios
      - name: Build for the iOS Simulator
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/sim CODE_SIGNING_ALLOWED=NO build
          (cd build/sim/Build/Products/Debug-iphonesimulator && zip -qry "$GITHUB_WORKSPACE/RepWise-simulator.zip" App.app)
      - name: Build unsigned device IPA
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build/dev CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          mkdir -p Payload && cp -R build/dev/Build/Products/Release-iphoneos/App.app Payload/
          zip -qry RepWise-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: RepWise-iOS
          path: |
            RepWise-simulator.zip
            RepWise-unsigned.ipa
      # Rolling "latest" release so the website's download links never change:
      # /releases/latest/download/RepWise.apk and /releases/latest/download/RepWise-unsigned.ipa
      - name: Publish to the latest release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: RepWise (latest build)
          make_latest: true
          body: |
            Latest RepWise build from `${{ github.sha }}`.
            - **RepWise.apk** — Android: open on your phone and install (allow installs from your browser when asked).
            - **RepWise-unsigned.ipa** — iPhone: sign and install with your Apple ID using Sideloadly or AltStore.
            - **RepWise-simulator.zip** — iOS Simulator build for testing on a Mac.
          files: |
            apk/RepWise.apk
            RepWise-unsigned.ipa
            RepWise-simulator.zip
